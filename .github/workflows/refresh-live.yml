name: Refresh live feed

# Keeps data/live.json current while a tournament is being played. The generator never
# invents a rating: if the match source has no usable matches, the event keeps its status and
# its rating stays absent, and the app shows it as awaiting stats.

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Update the live feed
        run: python3 tools/live_update.py

      - name: Rebuild the bundled dataset
        run: python3 tools/build_dataset.py

      - name: Publish the payload the app refreshes from
        run: cp app/src/main/assets/pace_dataset.json data/latest.json

      - name: Verify
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Commit if anything changed
        run: |
          git config user.name "court-pace-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data app/src/main/assets/pace_dataset.json
          if git diff --quiet --cached; then
            echo "No change."
          else
            git commit -m "chore: refresh live feed"
            git push
          fi
