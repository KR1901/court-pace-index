name: Publish app dataset snapshot

on:
  push:
    branches: [main]
    paths:
      - 'data/live.json'
      - 'tools/build_dataset.py'
      - '.github/workflows/refresh-live.yml'
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Probe ATP results-page reachability (diagnostic only)
        run: python tools/probe_sofascore.py

      - name: Rebuild the app dataset snapshot
        run: python tools/build_dataset.py

      - name: Publish the payload used by app dataset refresh
        run: cp app/src/main/assets/pace_dataset.json data/latest.json

      - name: Report visible events and retained schedule windows
        run: |
          python - <<'PY'
          import json
          with open("app/src/main/assets/pace_dataset.json", encoding="utf-8") as stream:
              dataset = json.load(stream)
          visible = dataset.get("live", [])
          schedule = dataset.get("liveSchedule", [])
          visible_ids = {(event.get("t"), event.get("s")) for event in visible}
          retained_only = [
              event for event in schedule
              if (event.get("t"), event.get("s")) not in visible_ids
          ]
          print(f"visible fallback events: {len(visible)}")
          for event in visible:
              print("LIVE", event.get("t"), event.get("status"), event.get("start"), event.get("end"))
          print(f"retained schedule-only rows (stale-route guards): {len(retained_only)}")
          for event in retained_only:
              print("SCHEDULE ONLY", event.get("t"), event.get("status"), event.get("end"))
          print("Live Surface Speed is computed on-device; this workflow does not request Infosys match statistics.")

          # Guard the specific stale Paris row corrected in data/live.json.
          paris_source = next(
              (event for event in json.load(open("data/live.json", encoding="utf-8")).get("events", [])
               if event.get("t") == "paris" and event.get("s") == 2026),
              None,
          )
          if paris_source is None or paris_source.get("status") != "completed":
              raise SystemExit("Paris 2026 must remain a completed schedule tombstone.")
          if not any(event.get("t") == "paris" and event.get("s") == 2026 for event in schedule):
              raise SystemExit("Paris 2026 schedule tombstone was dropped from the generated dataset.")
          if any(event.get("t") == "paris" and event.get("s") == 2026 for event in visible):
              raise SystemExit("Completed Paris 2026 must not appear in the visible Live now fallback list.")

          stockholm_source = next(
              (event for event in json.load(open("data/live.json", encoding="utf-8")).get("events", [])
               if event.get("t") == "stockholm" and event.get("s") == 2026),
              None,
          )
          if stockholm_source is not None and stockholm_source.get("status") == "in_progress":
              if not any(event.get("t") == "stockholm" and event.get("s") == 2026 for event in visible):
                  raise SystemExit("Active Stockholm 2026 was unexpectedly omitted from the visible live list.")
          print("Paris/Stockholm live-schedule checks passed.")
          PY

      - name: Commit if anything changed
        run: |
          git config user.name "court-pace-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data app/src/main/assets/pace_dataset.json
          if git diff --quiet --cached; then
            echo "No change."
          else
            git commit -m "chore: publish refreshed app dataset snapshot"
            git push
          fi
