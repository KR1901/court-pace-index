name: Refresh live feed

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe ATP stats pages
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          echo "=== results page"
          curl -s -m 40 -A "$UA" "https://www.atptour.com/en/scores/current/paris/352/results" -o /tmp/res.html -w "status=%{http_code} bytes=%{size_download}\n"
          echo "--- hrefs mentioning stats"
          grep -oE 'href="[^"]*[Ss]tat[^"]*"' /tmp/res.html | sort -u | head -15
          echo "--- match-ish links"
          grep -oE 'href="/en/scores/[^"]*"' /tmp/res.html | sort -u | head -15
          echo "--- does results page contain aces"
          grep -ci "ace" /tmp/res.html || true
      - name: Probe candidate stats endpoints
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          for u in \
            "https://www.atptour.com/en/scores/stats-centre/2026/352/ms001" \
            "https://www.atptour.com/en/scores/current/paris/352/stats" \
            "https://www.atptour.com/en/scores/current/paris/352/results?match=MS001" ; do
            echo "=== $u"
            curl -s -m 30 -A "$UA" "$u" -o /tmp/s.html -w "status=%{http_code} bytes=%{size_download}\n"
            grep -oiE '.{0,30}aces?.{0,30}' /tmp/s.html | head -4
          done
