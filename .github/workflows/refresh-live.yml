name: Refresh live feed

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the browser
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Probe a free, keyless source
        run: python tools/probe_sofascore.py

      - name: Rebuild the bundled dataset
        run: python tools/build_dataset.py

      - name: Publish the payload the app refreshes from
        run: cp app/src/main/assets/pace_dataset.json data/latest.json

      - name: Show the result
        run: |
          python - <<'EOF'
          import json
          live = json.load(open("data/live.json"))
          for e in live.get("events", []):
              print(e.get("t"), "speed=", e.get("speed"), "ace=", e.get("ace"), "matches=", e.get("matches"))
          EOF

      - name: Note whether the site served us
        run: |
          python - <<'EOF'
          import json
          live = json.load(open("data/live.json"))
          for e in live.get("events", []):
              if e.get("speed") is None:
                  print("No rating: the ATP site refuses datacentre addresses, so this job "
                        "cannot read the stats pages. The app reads them on the device instead.")
          EOF

      - name: Commit if anything changed
        run: |
          git config user.name "court-pace-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data app/src/main/assets/pace_dataset.json
          if git diff --quiet --cached; then
            echo "No change."
          else
            git commit -m "chore: refresh live rating from the ATP stats pages"
            git push
          fi
