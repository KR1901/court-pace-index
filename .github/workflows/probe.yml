name: Probe live stats sources
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe endpoints
        run: |
          for u in \
            "https://api.sofascore.com/api/v1/sport/tennis/events/live" \
            "https://www.atptour.com/en/scores/current/paris/352/results" \
            "https://tennistourdata.com/" ; do
            echo "=== $u"
            curl -s -m 25 -A "Mozilla/5.0 (X11; Linux x86_64)" -o /tmp/r.txt \
              -w "status=%{http_code} type=%{content_type} bytes=%{size_download}\n" "$u" || echo "curl failed"
            head -c 700 /tmp/r.txt 2>/dev/null; echo
          done
