name: ATP official archive one-time probe

on:
  push:
    branches:
      - feature/atp-event-period-contract-pace-year-picker-20261127
    paths:
      - "tools/_atp_archive_probe.py"
      - ".github/workflows/atp-archive-one-time-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser automation
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Inspect official ATP Results Archive pages
        run: python tools/_atp_archive_probe.py | tee atp-archive-probe.log
      - name: Upload probe output
        uses: actions/upload-artifact@v4
        with:
          name: atp-official-archive-probe
          path: atp-archive-probe.log
          if-no-files-found: error
          retention-days: 3
