name: Android CI

on:
  push:
    branches: [main, fix/live-tournament-discovery-and-refresh, feature/player-stats-v2, feature/height-groups-expanded-data]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

# Feature-branch validation uses its push run; the matching PR event is skipped.
# Keep event types in separate concurrency groups so a PR event cannot cancel the push build.
concurrency:
  group: android-ci-${{ github.event.pull_request.head.ref || github.ref_name }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.repository == 'KR1901/court-pace-index' && (github.event_name != 'pull_request' || github.head_ref != 'feature/height-groups-expanded-data') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check Python tooling syntax
        run: python3 -m py_compile tools/*.py

      - name: Test Player Stats source aggregation
        run: python3 -m unittest discover -s tools -p 'test_build_player_stats.py' -v

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      # This private app only needs the newest debug APK. Release APKs are GitHub
      # Release assets and are not touched by this Actions-artifact cleanup.
      - name: Prune older debug APK artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 }
            );
            const previous = artifacts.filter(
              item => item.name === "court-pace-debug-apk" && !item.expired
            );
            for (const artifact of previous) {
              core.info(`Deleting superseded debug APK artifact ${artifact.id} (${artifact.size_in_bytes} bytes)`);
              try {
                await github.rest.actions.deleteArtifact({
                  owner,
                  repo,
                  artifact_id: artifact.id,
                });
              } catch (error) {
                // Parallel/previous cleanup can delete the same artifact first.
                // A missing/expired artifact is already in the desired state.
                const status = error.status || error.response?.status;
                if (status === 404 || status === 410) {
                  core.warning(`Skipping already-missing debug APK artifact ${artifact.id}`);
                  continue;
                }
                throw error;
              }
            }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: court-pace-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 1
