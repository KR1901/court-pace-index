name: Android CI

on:
  push:
    branches: [main, fix/live-tournament-discovery-and-refresh, feature/player-stats-v2, feature/height-groups-expanded-data]
  pull_request:
  workflow_dispatch:
    inputs:
      upload_debug_apk:
        description: Upload the debug APK artifact (requires available Actions storage quota)
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: write

# Feature-branch validation uses its push run; the matching PR event is skipped.
# Keep event types in separate concurrency groups so a PR event cannot cancel the push build.
concurrency:
  group: android-ci-${{ github.event.pull_request.head.ref || github.ref_name }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.repository == 'KR1901/court-pace-index' && (github.event_name != 'pull_request' || github.head_ref != 'feature/height-groups-expanded-data') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check Python tooling syntax
        run: python3 -m py_compile tools/*.py

      - name: Run all Python tooling unit tests
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      # Keep only the newest optional debug APK artifact. Production APKs are GitHub
      # Release assets and are not touched by this Actions-artifact cleanup.
      - name: Prune older debug APK artifacts
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const listAllArtifacts = () => github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 }
            );
            const toMiB = (bytes) => (bytes / (1024 * 1024)).toFixed(2);
            const before = await listAllArtifacts();
            const active = before.filter((item) => !item.expired);
            const previous = active.filter(
              (item) => item.name === "court-pace-debug-apk"
            );
            const totalBytes = active.reduce(
              (sum, item) => sum + (item.size_in_bytes || 0), 0
            );
            const previousBytes = previous.reduce(
              (sum, item) => sum + (item.size_in_bytes || 0), 0
            );
            core.info(
              `Repository artifact inventory: ${active.length} active artifacts, ${toMiB(totalBytes)} MiB total.`
            );
            core.info(
              `Superseded debug APK artifacts: ${previous.length}, ${toMiB(previousBytes)} MiB.`
            );

            for (const artifact of previous) {
              core.info(
                `Deleting debug APK artifact ${artifact.id} (${artifact.size_in_bytes} bytes).`
              );
              try {
                await github.rest.actions.deleteArtifact({
                  owner,
                  repo,
                  artifact_id: artifact.id,
                });
              } catch (error) {
                // Parallel/previous cleanup can delete the same artifact first.
                // A missing/expired artifact is already in the desired state.
                const status = error.status || error.response?.status;
                if (status === 404 || status === 410) {
                  core.warning(`Skipping already-missing debug APK artifact ${artifact.id}`);
                  continue;
                }
                throw error;
              }
            }

            const after = await listAllArtifacts();
            const remaining = after.filter(
              (item) => item.name === "court-pace-debug-apk" && !item.expired
            );
            const remainingBytes = remaining.reduce(
              (sum, item) => sum + (item.size_in_bytes || 0), 0
            );
            core.info(
              `Post-prune debug APK artifacts: ${remaining.length}, ${toMiB(remainingBytes)} MiB.`
            );
            if (remaining.length > 0) {
              throw new Error(
                `Artifact cleanup left ${remaining.length} active debug APK artifact(s).`
              );
            }

      # Public repository: retire every legacy signing-key recovery artifact. Their
      # keystores and credential exports were exposed to repository readers before rotation.
      - name: Delete exposed legacy signing-key recovery artifacts
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const artifacts = (await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 }
            )).filter((item) => !item.expired &&
              item.name.startsWith("court-pace-release-signing-key-v"));
            core.info(`Found ${artifacts.length} exposed legacy signing-key recovery artifact(s).`);
            let deleted = 0;
            for (const artifact of artifacts) {
              try {
                await github.rest.actions.deleteArtifact({
                  owner, repo, artifact_id: artifact.id,
                });
                deleted += 1;
                core.info(`Deleted exposed signing-key recovery artifact ${artifact.id}.`);
              } catch (error) {
                const status = error.status || error.response?.status;
                if ([404, 410].includes(status)) {
                  core.warning(`Legacy key artifact ${artifact.id} was already unavailable.`);
                  continue;
                }
                if (status >= 500 || status === 429) {
                  core.warning(`GitHub artifact API temporarily failed for legacy key artifact ${artifact.id}; it will be retried on the next main CI run.`);
                  continue;
                }
                throw error;
              }
            }
            core.info(`Removed ${deleted} exposed legacy signing-key artifact(s).`);

      # Keep only the newest successful result for each research-report name.
      # Signing-key recovery artifacts are intentionally never included in this cleanup.
      - name: Prune superseded research audit artifacts
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 }
            );
            const active = artifacts.filter((item) => !item.expired);
            const reportPrefixes = [
              "expected-aces-formula-comparison-",
              "court-pace-deep-calculation-audit",
              "court-pace-nextgen-sensitivity-study",
              "surface-specific-tier-backfill-",
              "all-event-profile-coverage-",
              "lower-tier-profile-and-2026-forward-audit",
            ];
            const reports = active.filter((item) =>
              reportPrefixes.some((prefix) => item.name.startsWith(prefix))
            );
            const newestByName = new Map();
            const obsolete = [];
            for (const artifact of [...reports].sort(
              (a, b) => Date.parse(b.created_at) - Date.parse(a.created_at)
            )) {
              if (newestByName.has(artifact.name)) {
                obsolete.push(artifact);
              } else {
                newestByName.set(artifact.name, artifact);
              }
            }
            const bytes = obsolete.reduce(
              (sum, item) => sum + (item.size_in_bytes || 0), 0
            );
            const toMiB = (value) => (value / (1024 * 1024)).toFixed(2);
            core.info(
              `Research reports: ${reports.length} active; retaining ${newestByName.size} newest reports and pruning ${obsolete.length} duplicates (${toMiB(bytes)} MiB).`
            );
            for (const artifact of obsolete) {
              core.info(
                `Deleting superseded report ${artifact.name} (${artifact.id}, ${artifact.size_in_bytes} bytes).`
              );
              try {
                await github.rest.actions.deleteArtifact({
                  owner, repo, artifact_id: artifact.id,
                });
              } catch (error) {
                const status = error.status || error.response?.status;
                if ([404, 410].includes(status)) {
                  core.warning(`Artifact ${artifact.id} was already removed.`);
                  continue;
                }
                if (status >= 500 || status === 429) {
                  core.warning(`GitHub artifact API temporarily failed while deleting ${artifact.id} (HTTP ${status || "unknown"}); continuing with remaining cleanup.`);
                  continue;
                }
                throw error;
              }
            }
            let after = active;
            try {
              after = (await github.paginate(
                github.rest.actions.listArtifactsForRepo,
                { owner, repo, per_page: 100 }
              )).filter((item) => !item.expired);
            } catch (error) {
              core.warning(`Could not refresh the artifact inventory after cleanup (HTTP ${error.status || error.response?.status || "unknown"}); the deletion attempts above have completed.`);
            }
            const remainingReports = after.filter((item) =>
              reportPrefixes.some((prefix) => item.name.startsWith(prefix))
            );
            core.info(
              `Remaining active research reports: ${remainingReports.length}; preserved release signing-key recovery artifacts: ${after.filter((item) => item.name.startsWith("court-pace-release-signing-key-v")).length}.`
            );

      - name: Upload APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_debug_apk }}
        uses: actions/upload-artifact@v4
        with:
          name: court-pace-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 1
