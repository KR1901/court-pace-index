name: Release signed Android APK

on:
  # Wait for the full historical and bundled dataset refresh after a code/version push.
  # This prevents the signed APK from racing ahead with the previous pace_dataset.json.
  workflow_run:
    workflows: ["Refresh dataset"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: court-pace-release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify bundled Davis Cup schedule and no provisional live rating
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("app/src/main/assets/pace_dataset.json")
          if not path.is_file() or path.stat().st_size == 0:
              raise SystemExit("Bundled pace dataset is missing or empty.")
          dataset = json.loads(path.read_text(encoding="utf-8"))
          assert any(row.get("id") == "daviscup" for row in dataset.get("tournaments", [])), (
              "Bundled tournament metadata is missing Davis Cup."
          )
          assert any(
              row.get("t") == "daviscup" and row.get("s") == 2026
              for row in dataset.get("live", [])
          ), "Bundled Live now data is missing the 2026 Davis Cup Final 8 schedule row."
          davis_historical = [
              row for row in dataset.get("readings", [])
              if row.get("t") == "daviscup" and row.get("src") == "computed"
              and row.get("speed") is not None and 2016 <= row.get("s", 0) <= 2024
          ]
          assert davis_historical, "Bundled dataset has no historical Davis Cup CALC reading."
          historical_years = sorted({row["s"] for row in davis_historical})
          assert not any(
              row.get("t") == "daviscup" and row.get("src") == "tennisabstract"
              for row in dataset.get("readings", [])
          ), "Tennis Abstract Davis Cup fallback values must never be published."
          computed_source = next(
              (source for source in dataset.get("meta", {}).get("sources", [])
               if source.get("id") == "computed"),
              {},
          )
          tml_davis_source = (
              "TennisMyLife ATP Match Database + ongoing_tourneys.csv"
          )
          davis_2026 = [
              row for row in dataset.get("readings", [])
              if row.get("t") == "daviscup" and row.get("s") == 2026
              and row.get("src") == "computed" and row.get("speed") is not None
          ]
          if tml_davis_source in computed_source.get("detail", ""):
              assert davis_2026, (
                  "The validated TML 2026 source is declared, but the 2026 Davis Cup CALC is missing."
              )
          else:
              assert not davis_2026, (
                  "A 2026 Davis Cup CALC cannot be packaged without validated TML annual + ongoing source provenance."
              )
          assert not any(
              row.get("t") == "daviscup" and row.get("s") == 2026
              and row.get("src") == "live" and row.get("speed") is not None
              for row in dataset.get("readings", [])
          ), "A provisional Davis Cup live rating must not be packaged."
          assert not any(
              row.get("t") == "daviscup" and row.get("speed") is not None
              and row.get("s") not in range(2016, 2025)
              and not (row.get("s") == 2026 and row.get("src") == "computed"
                       and tml_davis_source in computed_source.get("detail", ""))
              for row in dataset.get("readings", [])
          ), "Davis Cup CALC outside 2016–2024 requires the validated TML 2026 source."
          print(
              "Bundled Davis Cup historical CALC years=" + ",".join(map(str, historical_years))
              + "; TML 2026 CALC=" + ("present" if davis_2026 else "withheld")
              + "; Final 8 schedule is present; no provisional live rating is packaged."
          )
          PY

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read version metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          from pathlib import Path

          text = Path("app/build.gradle.kts").read_text(encoding="utf-8")
          code = re.search(r"\bversionCode\s*=\s*(\d+)", text)
          name = re.search(r'\bversionName\s*=\s*"([^"]+)"', text)
          if not code or not name:
              raise SystemExit("Could not read Android versionCode/versionName")
          version_code = int(code.group(1))
          version_name = name.group(1)
          if not re.fullmatch(r"\d+\.\d+\.\d+", version_name):
              raise SystemExit(f"Expected stable semantic version, got {version_name!r}")
          print(f"version={version_name}")
          print(f"version_code={version_code}")
          print(f"tag=v{version_name}")
          PY

      - name: Skip if this version is already published
        id: tag
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Version $TAG is already published; no duplicate release is needed."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Load and verify the new public-release signing key
        if: ${{ steps.tag.outputs.skip != 'true' }}
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.COURT_PACE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.COURT_PACE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.COURT_PACE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.COURT_PACE_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: "b926c85062406061557bd1557c2edaa3f7710189ac4084c0a4cecb363c9223e9"
        run: |
          set -euo pipefail
          keyfile="$RUNNER_TEMP/court-pace-public-release-v1.jks"
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::The new public-release signing identity is not configured. Add all four COURT_PACE_* repository Actions secrets from the private signing kit before dispatching this workflow."
            exit 1
          fi

          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keyfile"
          test -s "$keyfile"
          keytool -list -keystore "$keyfile" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          actual_fingerprint="$(keytool -exportcert -keystore "$keyfile" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | sha256sum | awk '{print $1}')"
          if [[ "$actual_fingerprint" != "$EXPECTED_CERT_SHA256" ]]; then
            echo "::error::The configured signing certificate does not match the new Court Pace public-release identity. Release blocked."
            exit 1
          fi

          # Mask credentials before exposing them to Gradle through GITHUB_ENV.
          echo "::add-mask::$KEYSTORE_BASE64"
          echo "::add-mask::$KEYSTORE_PASSWORD"
          echo "::add-mask::$KEY_ALIAS"
          echo "::add-mask::$KEY_PASSWORD"
          {
            echo "COURT_PACE_KEYSTORE=$keyfile"
            echo "COURT_PACE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "COURT_PACE_KEY_ALIAS=$KEY_ALIAS"
            echo "COURT_PACE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "New public-release certificate verified: $actual_fingerprint"

      - name: Run unit tests
        if: ${{ steps.tag.outputs.skip != 'true' }}
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest --no-daemon --max-workers=1 --stacktrace

      - name: Assemble signed production APK
        if: ${{ steps.tag.outputs.skip != 'true' }}
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease --no-daemon --max-workers=1 --stacktrace

      - name: Verify production package, version and APK signature
        if: ${{ steps.tag.outputs.skip != 'true' }}
        id: verify
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          signature_report="$("$build_tools/apksigner" verify --verbose --print-certs "$apk")"
          printf '%s\\n' "$signature_report"
          actual_signer="$(printf '%s\\n' "$signature_report" | awk '/certificate SHA-256 digest:/ {print $NF; exit}')"
          expected_signer="b926c85062406061557bd1557c2edaa3f7710189ac4084c0a4cecb363c9223e9"
          if [[ "$actual_signer" != "$expected_signer" ]]; then
            echo "::error::APK signer fingerprint does not match the new Court Pace public-release certificate."
            exit 1
          fi
          echo "APK signer continuity verified: $actual_signer"
          "$build_tools/aapt" dump badging "$apk" | head -n 1 | tee package.txt
          grep -F "name='ink.courtpace.index.public'" package.txt
          grep -F "versionCode='$VERSION_CODE'" package.txt
          grep -F "versionName='$VERSION'" package.txt

          mkdir -p "$RUNNER_TEMP/release"
          cp "$apk" "$RUNNER_TEMP/release/court-pace-$VERSION.apk"
          sha256sum "$RUNNER_TEMP/release/court-pace-$VERSION.apk" | tee "$RUNNER_TEMP/release/SHA256SUMS.txt"
          echo "apk=$RUNNER_TEMP/release/court-pace-$VERSION.apk" >> "$GITHUB_OUTPUT"
          echo "sha256=$(cut -d' ' -f1 "$RUNNER_TEMP/release/SHA256SUMS.txt")" >> "$GITHUB_OUTPUT"

      - name: Prepare release notes
        if: ${{ steps.tag.outputs.skip != 'true' }}
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          SHA256: ${{ steps.verify.outputs.sha256 }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          version_code = os.environ["VERSION_CODE"]
          package = "ink.courtpace.index.public"
          asset = f"court-pace-{version}.apk"
          sha256 = os.environ["SHA256"]

          if not sha256 or len(sha256) != 64:
              raise SystemExit("Missing or invalid APK SHA-256 for release notes.")

          lines = [
              f"## Court Pace {version}",
              "",
              "Production release from the verified main branch.",
              "",
          ]

          if version == "4.0.0":
              lines += [
                  "### New standalone app identity",
                  "- Introduces the new application ID `ink.courtpace.index.public` and a new independent RSA-4096 release signing certificate.",
                  "- Installs alongside the legacy `ink.courtpace.index` app; it does not replace or update the legacy installation.",
                  "- App-private settings and cached data are separate and are not automatically migrated from the legacy app.",
                  "- Future releases under `ink.courtpace.index.public` use the same new certificate for normal in-place updates.",
                  "",
              ]
          elif version == "4.1.0":
              lines += [
                  "### H2H player comparison",
                  "- Adds a dedicated H2H screen with searchable ATP player selection and career meeting history.",
                  "- Shows head-to-head wins, current ATP rank, age and height.",
                  "- Adds independent Year-to-date and Career records with All, Hard, Outdoor Hard, Indoor Hard, Grass and Clay filters.",
                  "- Hard combines indoor and outdoor hard results, including hard matches whose venue setting is unknown; venue-specific filters use only explicitly classified data.",
                  "- Adds ATP tour-level title counts and a newest-first meeting list with event, round, score, surface and tournament date.",
                  "- Preserves the existing CPI/CALC formulas, Surface Speed calculations, Live Now pipeline and Player Stats refresh logic.",
                  "",
              ]
          elif version == "4.1.1":
              lines += [
                  "### H2H record accuracy and surface breakdown",
                  "- Adds Win% immediately below W/L in both Year-to-date and Career player comparison cards.",
                  "- Win% is calculated from the selected surface's wins and losses and is shown to one decimal place; it remains unavailable when no valid W/L denominator exists.",
                  "- Makes ATP title counts follow the selected All, Hard, Outdoor Hard, Indoor Hard, Grass or Clay filter in both record sections.",
                  "- Uses source-derived tournament venue metadata for Indoor Hard/Outdoor Hard title attribution; unknown or conflicting venue settings are not guessed.",
                  "- Preserves the existing H2H meeting history, CPI/CALC formulas, Surface Speed calculations and Live Now pipeline.",
                  "",
              ]
          elif version == "4.1.7":
              lines += [
                  "### Chronological CALC and Davis Cup coverage corrections",
                  "- Recomputes tournament CALC chronologically with a 14-day quarantine on source tournament start dates. The source CSV does not provide individual match dates, so the quarantine prevents overlapping later rounds from leaking into earlier tournament profiles and normalisation anchors.",
                  "- Restores the 2026 ATP Finals source label variants (ATP Finals and Nitto ATP Finals) to the app's atpfinals event, with the data-refresh gate requiring all 15 singles matches.",
                  "- Merges annual and ongoing TML Davis Cup rows before deduplication and status classification, using player identities to distinguish separate rubbers that reuse a match number.",
                  "- Separates played singles with valid serve statistics, missing statistics, malformed statistics, scoreless/pending-result rows and walkovers/no-play; doubles remain excluded.",
                  "- Adds a reconciled, aggregate-only Davis Cup source audit and blocks publication when source buckets or 2026 CALC output do not balance.",
                  "- Never fills missing serve statistics with invented values or uses Davis Cup matches to train standard ATP player profiles or the ATP season normaliser.",
                  "- Keeps raw TML match rows out of the repository and APK; only aggregate event ratings and coverage diagnostics are published. TML data remains restricted to free non-commercial analytical use unless written permission is obtained.",
                  "- Preserves the existing ATP/Infosys live path, CPI and Tennis Abstract reference series.",
                  "",
              ]
          elif version == "4.1.6":
              lines += [
                  "### Davis Cup 2026 season-to-date Surface Speed",
                  "- Adds a 2026 Davis Cup CALC reading from TML's annual ATP match CSV plus its ongoing-tournament supplement, with source identity, schema, freshness and SHA-256 validation.",
                  "- Refreshes the Davis Cup live estimate on-device from newly completed singles rubbers using the same opponent-adjusted expected-aces method as the ATP live ratings.",
                  "- Labels the figure as a TML season-to-date, multi-surface Davis Cup aggregate; it is not a Bologna-only court measurement.",
                  "- Keeps Davis Cup out of standard ATP player-profile training and the ATP season normaliser; missing serve statistics are never treated as zero.",
                  "- Keeps raw TML CSV data out of the repository and APK; only aggregate rating and coverage metadata are stored. This source is restricted to free non-commercial analytical use; obtain written permission before monetisation or commercial use.",
                  "- Retains the completed-event LOEO CALC selection fix from 4.1.5 and the existing ATP/Infosys live path.",
                  "",
              ]
          elif version == "4.1.4":
              lines += [
                  "### Davis Cup historical Surface Speed and Final 8 schedule",
                  "- Adds Davis Cup (level D) historical match observations as a separate annual CALC target where valid archive serve statistics are available (2016–2024).",
                  "- Keeps Davis Cup outside standard ATP player-profile training and the ATP season normaliser; editions are labelled multi-surface.",
                  "- Adds the 2026 Davis Cup Final 8 as a schedule-only Live now event. A live rating is withheld because a stable official 2026 match-stat feed and its permitted use have not been verified.",
                  "- Removes the unverified third-party Davis Cup stats prototype and ignores its old locally cached ratings.",
                  "- Preserves ATP live discovery and ratings, dataset refresh behavior, Player Stats, CPI and existing Surface Speed calculations.",
                  "",
              ]
          elif version == "4.1.3":
              lines += [
                  "### H2H score coverage and Tiebreak Win%",
                  "- Backfills a blank pair-meeting score from either selected player's already-fetched match history, matched by exact stable match identity; existing partial scores and conflicting data are never overwritten or guessed.",
                  "- Separates raw score availability from completed-set coverage, so a recorded retirement score such as 5-0 RET is shown as available even though it contributes no completed set.",
                  "- Adds Tiebreak Win% alongside Tiebreak W/L in the H2H card and all YTD/Career surface sections; it is tiebreaks won divided by tiebreaks played and remains unavailable when no tiebreak was played.",
                  "- Preserves set/tiebreak parsing, score strings including parenthesized tiebreak points, and all existing match/title/CPI/CALC/Player Stats/Live Now calculations.",
                  "",
              ]
          elif version == "4.1.2":
              lines += [
                  "### H2H set and tiebreak statistics",
                  "- Adds Set W/L, Set Win% and Tiebreak W/L for both players in the head-to-head comparison card.",
                  "- Extends Set W/L, Set Win% and Tiebreak W/L to Year-to-date and Career records for All, Hard, Outdoor Hard, Indoor Hard, Grass and Clay.",
                  "- Derives set results from completed score lines and maps winner-first score fields to each player's stable ID.",
                  "- Counts 7–6 set tiebreaks and deciding match tiebreaks in Tiebreak W/L; ignores unfinished retirement sets and reports missing score data as unavailable.",
                  "- Uses the same ATP Tour main-draw match population as the Player Stats W/L archive for YTD/Career set metrics; qualifying and Challenger scores are not added to those totals.",
                  "- Preserves existing match W/L, H2H title counts, CPI/CALC, Player Stats refresh and Live Now calculations.",
                  "",
              ]
          elif version == "3.2.1":
              lines += [
                  "### Included in 3.2.1",
                  "- Corrected Paris Masters 2026 to a completed schedule tombstone while retaining its event window to reject stale ATP routes.",
                  "- Regenerated the bundled dataset: Paris is schedule-only; Stockholm remains visible as the active-event fallback.",
                  "- Made the dataset publisher react to live-schedule and generator changes, with explicit Paris/Stockholm integrity checks.",
                  "- Kept live Surface Speed calculation on-device through ATP/Infosys; the production opponent-adjusted rating engine is unchanged.",
                  "- Updated About, README, data provenance and source-specific licensing documentation.",
                  "",
              ]
          elif version == "3.3.0":
              lines += [
                  "### Included in 3.3.0",
                  "- Added the dedicated ATP Player Stats screen with calendar-year Hold%, Break% and combined H+B rankings, full eligible-player search, surface filters and current-Top-100 height-group analysis.",
                  "- Added automatic Player Stats result/stat ingestion for all eligible ATP tour-level men's singles main-draw players, with approximately 15-second foreground checks and network-connected WorkManager background refresh.",
                  "- Added completed-score validation, stable match deduplication, delayed game-stat enrichment and a private atomic on-device cache.",
                  "- Preserved the existing CPI and Surface Speed calculations, datasets, live ATP rating path and original four navigation tabs.",
                  "- Retained the private personal/non-commercial data-use boundary for TennisMyLife-derived Player Stats.",
                  "",
              ]
          elif version == "3.3.1":
              lines += [
                  "### Corrective Player Stats release",
                  "- Includes the ATP Player Stats screen: calendar-year Hold%, Break% and H+B rankings, all-player search, surface filters and current-Top-100 height-group analysis.",
                  "- Automatically ingests newly completed eligible ATP tour-level men's singles results and valid game statistics, with approximately 15-second foreground checks and network-connected WorkManager background refresh.",
                  "- Includes completed-score validation, cross-feed match deduplication, delayed game-stat enrichment and a private atomic on-device cache.",
                  "- Re-issued with the original v3.2.1 signing certificate so it supports an in-place update from v3.2.1.",
                  "- Do not use v3.3.0 as an in-place update: it was signed with a different certificate. If v3.3.0 was installed, uninstall it before installing v3.3.1.",
                  "- Preserves the existing CPI and Surface Speed calculation paths and the private personal/non-commercial data-use boundary.",
                  "",
              ]
          elif version == "3.3.2":
              lines += [
                  "### Year-specific ATP Top 100 height analysis",
                  "- Historical Height Groups now use each calendar year's own final ATP Top 100 ranking snapshot; the live 2026 season uses its latest available dated snapshot.",
                  "- Preserves co-ranked players and reports ranking rows without stable player IDs separately instead of inventing player identities.",
                  "- Shows the exact ranking snapshot date and cohort counts for the selected season.",
                  "- Keeps annual Hold%, Break% and H+B calculations, pooled game denominators, player search, surface filters and live Player Stats ingestion.",
                  "- Preserves the CPI and Surface Speed formulas, live ATP calculation paths and existing pace datasets.",
                  "- Retains the private personal/non-commercial boundary for TennisMyLife-derived Player Stats data.",
                  "",
              ]
          elif version == "3.3.3":
              lines += [
                  "### Indian date/time display and six height groups",
                  "- Player Stats dates now use DD-MM-YY and source timestamps are converted to India Standard Time (IST, Asia/Kolkata).",
                  "- Applies Indian date/time formatting to the archive baseline, live-sync check time, last update time and year-specific ranking snapshot dates; date-only snapshots are not shifted.",
                  "- Replaces the four broad height groups with six exhaustive, non-overlapping bands: under 1.83 m, 1.83–1.85 m, 1.86–1.88 m, 1.89–1.91 m, 1.92–1.94 m and 1.95 m+.",
                  "- Aligns the Android analytics, annual Player Stats builder, refresh-workflow integrity checks and documentation on the same six height bands.",
                  "- Retains year-specific Top 100 cohorts, pooled Hold%/Break%/H+B calculations, sample coverage, surface filters, player search and automatic live result/stat updates.",
                  "- Preserves the CPI and Surface Speed formulas, live ATP rating path and pace datasets.",
                  "- Retains the private personal/non-commercial boundary for TennisMyLife-derived Player Stats data.",
                  "",
              ]
          elif version == "3.3.4":
              lines += [
                  "### Expanded year-specific ATP height-group cohorts",
                  "- Adds selectable Top 100 (default), Top 500 and Top 1000 cohorts in Player Stats → Height groups.",
                  "- Historical expanded cohorts use each calendar year's final TML ranking snapshot; the live season uses the latest available official ATP ranking list.",
                  "- Preserves the established TML Top 100 membership and cross-checks the expanded live ranking against that cohort.",
                  "- Retains tied ranks, counts unresolved or ambiguous player identities separately, and marks insufficient ranking depth unavailable instead of substituting a smaller cohort.",
                  "- Keeps the six existing height bands, same-year match statistics, surface filters, pooled Hold%/Break%/H+B calculations and W–L coverage.",
                  "- Preserves CPI and Surface Speed formulas, live ATP rating paths, pace datasets and automatic Player Stats match updates.",
                  "- Retains the private personal/non-commercial boundary for TennisMyLife-derived Player Stats data.",
                  "",
              ]
          elif version == "3.3.5":
              lines += [
                  "### Expanded ATP-level Height Groups coverage",
                  "- Adds separate All ATP levels and ATP Tour only scopes for Height Groups; Challenger and ATP qualifying data enriches Height Groups without changing the Tour-only Player Rankings ledger.",
                  "- Extends automatic current-season ingestion to completed ATP Challenger main-draw and ATP Tour qualifying matches, including ongoing Challenger feeds.",
                  "- Uses source-specific match identities and deduplication so delayed statistics enrichment does not double-count results across ATP sources.",
                  "- Adds auditable unresolved ranking-row details, exact official ATP identity overrides and verified missing-height enrichments for expanded Top 500 and Top 1000 cohorts.",
                  "- Retains year-specific ranking cohorts, six height bands, surface filters, pooled Hold%/Break%/H+B calculations and match-coverage reporting.",
                  "- Preserves CPI and Surface Speed formulas, live ATP rating paths and existing pace datasets.",
                  "- Retains the private personal/non-commercial boundary for TennisMyLife-derived Player Stats data.",
                  "",
              ]
          elif version == "3.3.12":
              lines += [
                  "### Dataset refresh and reliability",
                  "- Makes the current-season Tennis Abstract comparison checks refresh-safe for Rio, Adelaide, Montpellier and Laver Cup, validating presence, finite supported ranges and accessor consistency.",
                  "- Reduces the full historical dataset refresh to twice daily while retaining the lightweight three-hour live snapshot publisher.",
                  "- Runs the CALC speed-computation Python regression tests in Android CI and avoids full historical rebuilds for test-only or workflow-only edits.",
                  "- Regenerated and validated the published archive against refreshed source tables and retained historical CALC diagnostics.",
                  "",
              ]
          elif version == "3.3.11":
              lines += [
                  "### CPI snapshot and live Player Stats freshness",
                  "- Uses the complete current Court Speed CPI table as the authoritative snapshot instead of merging it with a stale hard-coded list.",
                  "- Correctly maps the source's \"Rome Clay\" row to Rome Masters, restoring its seven published readings (2016, 2017, 2018, 2023–2026); Rome 2026 remains 25.4.",
                  "- Preserves the current source's actual coverage (106 readings); ATP Finals 2026 remains blank because Court Speed has not published a 2026 physical reading.",
                  "- Refreshes the published CPI/CALC/TA dataset every five minutes while the app is open and bypasses stale HTTP cache responses.",
                  "- Shows the ATP match-data provider's last source-file modification time separately from the app's last successful poll on Player Stats.",
                  "- Warns when the ATP provider has not changed its current-season ATP Tour files for 12 hours, distinguishing an upstream publication delay from an app refresh failure.",
                  "- Retains all-player match aggregation, player-ID discovery, stable match deduplication and delayed service/return statistics enrichment.",
                  "- Preserves the existing CPI formula, CALC methodology, ATP live rating pipeline, all-player Player Stats calculations and private personal/non-commercial data-use boundary.",
                  "",
              ]
          else:
              lines += [
                  "### Included",
                  "- See the commits included in this release for the changes delivered in this version.",
                  "",
              ]

          lines += [
              "### Build verification",
              f"- Version: **{version}** (versionCode {version_code})",
              f"- Package: `{package}`",
              f"- APK: `{asset}`",
              f"- SHA-256: `{sha256}`",
              "",
          ]

          if version == "4.0.0":
              lines += [
                  "This APK is signed with the new Court Pace public-release certificate. Keep the signing kit in at least two secure offline backups; never upload it to the public repository.",
                  "",
              ]
          else:
              lines += [
                  "This APK uses the Court Pace public-release certificate and supports in-place upgrades from earlier releases of the same application ID.",
                  "",
              ]

          notes = "\n".join(lines) + "\n"
          required = [
              f"- Package: `{package}`",
              f"- APK: `{asset}`",
              f"- SHA-256: `{sha256}`",
          ]
          if any(item not in notes for item in required):
              raise SystemExit("Release notes are missing package, APK, or checksum metadata.")
          Path(os.environ["RUNNER_TEMP"], "RELEASE_NOTES.md").write_text(
              notes, encoding="utf-8"
          )
          PY

      - name: Publish stable GitHub release and APK
        if: ${{ steps.tag.outputs.skip != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Court Pace ${{ steps.meta.outputs.version }} — production release
          body_path: ${{ runner.temp }}/RELEASE_NOTES.md
          files: ${{ steps.verify.outputs.apk }}
          draft: false
          prerelease: false
        env:
