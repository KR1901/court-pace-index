name: Release signed Android APK

on:
  push:
    branches: [main]
    paths:
      - "app/build.gradle.kts"
      - "gradle.properties"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: court-pace-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require private repository before handling signing material
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          private="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')"
          if [[ "$private" != "true" ]]; then
            echo "::error::Release blocked: this personal-use repository must be private before a signing key is generated, restored, or retained."
            exit 1
          fi
          echo "Private-repository gate passed."

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read version metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          from pathlib import Path

          text = Path("app/build.gradle.kts").read_text(encoding="utf-8")
          code = re.search(r"\bversionCode\s*=\s*(\d+)", text)
          name = re.search(r'\bversionName\s*=\s*"([^"]+)"', text)
          if not code or not name:
              raise SystemExit("Could not read Android versionCode/versionName")
          version_code = int(code.group(1))
          version_name = name.group(1)
          if not re.fullmatch(r"\d+\.\d+\.\d+", version_name):
              raise SystemExit(f"Expected stable semantic version, got {version_name!r}")
          print(f"version={version_name}")
          print(f"version_code={version_code}")
          print(f"tag=v{version_name}")
          PY

      - name: Check release tag is unused
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists. Bump versionCode/versionName before publishing another release."
            exit 1
          fi

      - name: Restore the established Court Pace signing certificate
        id: signing
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEYSTORE_BASE64: ${{ secrets.COURT_PACE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.COURT_PACE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.COURT_PACE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.COURT_PACE_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: "12b96967077bd1ffcf1904d1095a8408fde1d462e07669f00059e51c9391d6ab"
        run: |
          set -euo pipefail
          keyfile="$RUNNER_TEMP/court-pace-release.jks"
          recovery="$RUNNER_TEMP/signing-recovery"
          download_dir="$RUNNER_TEMP/prior-signing-recovery"
          mkdir -p "$recovery" "$download_dir"
          umask 077
          recovered_from_artifact=false

          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keyfile"
            echo "Signing key restored from repository Actions secrets."
          elif [[ -z "$KEYSTORE_BASE64" && -z "$KEYSTORE_PASSWORD" && -z "$KEY_ALIAS" && -z "$KEY_PASSWORD" ]]; then
            # Search every Actions-artifact page. Filtering only the newest 100 artifacts
            # previously missed the retained v3.2.1 signer after many CI artifacts accumulated.
            artifact_records="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false and (.name | startswith("court-pace-release-signing-key-v")))' )"
            candidates="$(jq -s 'sort_by(.created_at) | reverse' <<<"$artifact_records")"

            while IFS=$'\t' read -r recovery_run_id artifact_name artifact_id; do
              [[ -n "$recovery_run_id" && -n "$artifact_name" && -n "$artifact_id" ]] || continue
              candidate_dir="$download_dir/$artifact_id"
              mkdir -p "$candidate_dir"

              if ! gh run download "$recovery_run_id" --repo "$GITHUB_REPOSITORY" --name "$artifact_name" --dir "$candidate_dir" >/dev/null 2>&1; then
                rm -rf "$candidate_dir"
                continue
              fi

              prior_keystore="$(find "$candidate_dir" -type f -name court-pace-signing-key.jks -print -quit)"
              prior_secrets="$(find "$candidate_dir" -type f -name GITHUB_ACTIONS_SECRETS.txt -print -quit)"
              [[ -s "$prior_keystore" && -s "$prior_secrets" ]] || { rm -rf "$candidate_dir"; continue; }

              candidate_base64=""
              candidate_store_password=""
              candidate_alias=""
              candidate_key_password=""
              while IFS= read -r line; do
                name="${line%%=*}"
                value="${line#*=}"
                case "$name" in
                  COURT_PACE_KEYSTORE_BASE64) candidate_base64="$value" ;;
                  COURT_PACE_KEYSTORE_PASSWORD) candidate_store_password="$value" ;;
                  COURT_PACE_KEY_ALIAS) candidate_alias="$value" ;;
                  COURT_PACE_KEY_PASSWORD) candidate_key_password="$value" ;;
                esac
              done < "$prior_secrets"

              if [[ -n "$candidate_base64" && -n "$candidate_store_password" && -n "$candidate_alias" && -n "$candidate_key_password" ]]; then
                candidate_fingerprint="$(keytool -exportcert -keystore "$prior_keystore" -storepass "$candidate_store_password" -alias "$candidate_alias" | sha256sum | awk '{print $1}')"
                if [[ "$candidate_fingerprint" == "$EXPECTED_CERT_SHA256" ]]; then
                  cp "$prior_keystore" "$keyfile"
                  KEYSTORE_BASE64="$candidate_base64"
                  KEYSTORE_PASSWORD="$candidate_store_password"
                  KEY_ALIAS="$candidate_alias"
                  KEY_PASSWORD="$candidate_key_password"
                  recovered_from_artifact=true
                  echo "Recovered the established v3.2.1 signing certificate from artifact $artifact_name."
                  break
                fi
                echo "Skipping artifact $artifact_name: its signing certificate is not the established Court Pace signer."
              fi
              rm -rf "$candidate_dir"
            done < <(jq -r '.[] | [.workflow_run.id, .name, (.id | tostring)] | @tsv' <<<"$candidates")

            if [[ "$recovered_from_artifact" != "true" ]]; then
              echo "::error::Could not recover the established Court Pace signing certificate. No new key will be generated. Configure all four COURT_PACE_* repository Actions secrets from the retained v3.2.1 recovery artifact."
              exit 1
            fi

            printf '%s' "$KEYSTORE_BASE64" > "$recovery/COURT_PACE_KEYSTORE_BASE64.txt"
            cat > "$recovery/GITHUB_ACTIONS_SECRETS.txt" <<EOF
          COURT_PACE_KEYSTORE_BASE64=$KEYSTORE_BASE64
          COURT_PACE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD
          COURT_PACE_KEY_ALIAS=$KEY_ALIAS
          COURT_PACE_KEY_PASSWORD=$KEY_PASSWORD
          EOF
            cp "$keyfile" "$recovery/court-pace-signing-key.jks"
            chmod 600 "$recovery/"*
          else
            echo "::error::Signing secrets are partially configured. Configure all four COURT_PACE_* secrets or clear all four so the workflow can recover the established signer."
            exit 1
          fi

          keytool -list -keystore "$keyfile" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          actual_fingerprint="$(keytool -exportcert -keystore "$keyfile" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | sha256sum | awk '{print $1}')"
          if [[ "$actual_fingerprint" != "$EXPECTED_CERT_SHA256" ]]; then
            echo "::error::Signing certificate fingerprint does not match the established v3.2.1 signer. Release blocked to protect in-place upgrades."
            exit 1
          fi
          echo "Established signing certificate verified: $actual_fingerprint"

          # Mask every credential before GITHUB_ENV exposes it to later steps.
          [[ -z "$KEYSTORE_BASE64" ]] || echo "::add-mask::$KEYSTORE_BASE64"
          [[ -z "$KEYSTORE_PASSWORD" ]] || echo "::add-mask::$KEYSTORE_PASSWORD"
          [[ -z "$KEY_ALIAS" ]] || echo "::add-mask::$KEY_ALIAS"
          [[ -z "$KEY_PASSWORD" ]] || echo "::add-mask::$KEY_PASSWORD"

          {
            echo "COURT_PACE_KEYSTORE=$keyfile"
            echo "COURT_PACE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "COURT_PACE_KEY_ALIAS=$KEY_ALIAS"
            echo "COURT_PACE_KEY_PASSWORD=$KEY_PASSWORD"
            echo "KEY_RECOVERY_DIR=$recovery"
          } >> "$GITHUB_ENV"
          echo "recovered_from_artifact=$recovered_from_artifact" >> "$GITHUB_OUTPUT"
          echo "key_transition=false" >> "$GITHUB_OUTPUT"

      - name: Retain recovered signing key for future releases
        if: steps.signing.outputs.recovered_from_artifact == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: court-pace-release-signing-key-v${{ steps.meta.outputs.version }}
          path: |
            ${{ env.KEY_RECOVERY_DIR }}/court-pace-signing-key.jks
            ${{ env.KEY_RECOVERY_DIR }}/COURT_PACE_KEYSTORE_BASE64.txt
            ${{ env.KEY_RECOVERY_DIR }}/GITHUB_ACTIONS_SECRETS.txt
          if-no-files-found: error
          retention-days: 90

      - name: Run unit tests
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest --no-daemon --max-workers=1 --stacktrace

      - name: Assemble signed production APK
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease --no-daemon --max-workers=1 --stacktrace

      - name: Verify production package, version and APK signature
        id: verify
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          signature_report="$("$build_tools/apksigner" verify --verbose --print-certs "$apk")"
          printf '%s\\n' "$signature_report"
          actual_signer="$(printf '%s\\n' "$signature_report" | awk '/certificate SHA-256 digest:/ {print $NF; exit}')"
          expected_signer="12b96967077bd1ffcf1904d1095a8408fde1d462e07669f00059e51c9391d6ab"
          if [[ "$actual_signer" != "$expected_signer" ]]; then
            echo "::error::APK signer fingerprint does not match the established v3.2.1 certificate."
            exit 1
          fi
          echo "APK signer continuity verified: $actual_signer"
          "$build_tools/aapt" dump badging "$apk" | head -n 1 | tee package.txt
          grep -F "name='ink.courtpace.index'" package.txt
          grep -F "versionCode='$VERSION_CODE'" package.txt
          grep -F "versionName='$VERSION'" package.txt

          mkdir -p "$RUNNER_TEMP/release"
          cp "$apk" "$RUNNER_TEMP/release/court-pace-$VERSION.apk"
          sha256sum "$RUNNER_TEMP/release/court-pace-$VERSION.apk" | tee "$RUNNER_TEMP/release/SHA256SUMS.txt"
          echo "apk=$RUNNER_TEMP/release/court-pace-$VERSION.apk" >> "$GITHUB_OUTPUT"
          echo "sha256=$(cut -d' ' -f1 "$RUNNER_TEMP/release/SHA256SUMS.txt")" >> "$GITHUB_OUTPUT"

      - name: Prepare release notes
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          SHA256: ${{ steps.verify.outputs.sha256 }}
          KEY_TRANSITION: ${{ steps.signing.outputs.key_transition }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          version_code = os.environ["VERSION_CODE"]
          package = "ink.courtpace.index"
          asset = f"court-pace-{version}.apk"
          sha256 = os.environ["SHA256"]
          key_transition = os.environ.get("KEY_TRANSITION", "false") == "true"

          if not sha256 or len(sha256) != 64:
              raise SystemExit("Missing or invalid APK SHA-256 for release notes.")

          lines = [
              f"## Court Pace {version}",
              "",
              "Production release from the verified main branch.",
              "",
          ]

          if version == "3.2.1":
              lines += [
                  "### Included in 3.2.1",
                  "- Corrected Paris Masters 2026 to a completed schedule tombstone while retaining its event window to reject stale ATP routes.",
                  "- Regenerated the bundled dataset: Paris is schedule-only; Stockholm remains visible as the active-event fallback.",
                  "- Made the dataset publisher react to live-schedule and generator changes, with explicit Paris/Stockholm integrity checks.",
                  "- Kept live Surface Speed calculation on-device through ATP/Infosys; the production opponent-adjusted rating engine is unchanged.",
                  "- Updated About, README, data provenance and source-specific licensing documentation.",
                  "",
              ]
          elif version == "3.3.0":
              lines += [
                  "### Included in 3.3.0",
                  "- Added the dedicated ATP Player Stats screen with calendar-year Hold%, Break% and combined H+B rankings, full eligible-player search, surface filters and current-Top-100 height-group analysis.",
                  "- Added automatic Player Stats result/stat ingestion for all eligible ATP tour-level men's singles main-draw players, with approximately 15-second foreground checks and network-connected WorkManager background refresh.",
                  "- Added completed-score validation, stable match deduplication, delayed game-stat enrichment and a private atomic on-device cache.",
                  "- Preserved the existing CPI and Surface Speed calculations, datasets, live ATP rating path and original four navigation tabs.",
                  "- Retained the private personal/non-commercial data-use boundary for TennisMyLife-derived Player Stats.",
                  "",
              ]
          elif version == "3.3.1":
              lines += [
                  "### Corrective Player Stats release",
                  "- Includes the ATP Player Stats screen: calendar-year Hold%, Break% and H+B rankings, all-player search, surface filters and current-Top-100 height-group analysis.",
                  "- Automatically ingests newly completed eligible ATP tour-level men's singles results and valid game statistics, with approximately 15-second foreground checks and network-connected WorkManager background refresh.",
                  "- Includes completed-score validation, cross-feed match deduplication, delayed game-stat enrichment and a private atomic on-device cache.",
                  "- Re-issued with the original v3.2.1 signing certificate so it supports an in-place update from v3.2.1.",
                  "- Do not use v3.3.0 as an in-place update: it was signed with a different certificate. If v3.3.0 was installed, uninstall it before installing v3.3.1.",
                  "- Preserves the existing CPI and Surface Speed calculation paths and the private personal/non-commercial data-use boundary.",
                  "",
              ]
          elif version == "3.3.2":
              lines += [
                  "### Year-specific ATP Top 100 height analysis",
                  "- Historical Height Groups now use each calendar year's own final ATP Top 100 ranking snapshot; the live 2026 season uses its latest available dated snapshot.",
                  "- Preserves co-ranked players and reports ranking rows without stable player IDs separately instead of inventing player identities.",
                  "- Shows the exact ranking snapshot date and cohort counts for the selected season.",
                  "- Keeps annual Hold%, Break% and H+B calculations, pooled game denominators, player search, surface filters and live Player Stats ingestion.",
                  "- Preserves the CPI and Surface Speed formulas, live ATP calculation paths and existing pace datasets.",
                  "- Retains the private personal/non-commercial boundary for TennisMyLife-derived Player Stats data.",
                  "",
              ]
          elif version == "3.3.3":
              lines += [
                  "### Indian date/time display and six height groups",
                  "- Player Stats dates now use DD-MM-YY and source timestamps are converted to India Standard Time (IST, Asia/Kolkata).",
                  "- Applies Indian date/time formatting to the archive baseline, live-sync check time, last update time and year-specific ranking snapshot dates; date-only snapshots are not shifted.",
                  "- Replaces the four broad height groups with six exhaustive, non-overlapping bands: under 1.83 m, 1.83–1.85 m, 1.86–1.88 m, 1.89–1.91 m, 1.92–1.94 m and 1.95 m+.",
                  "- Aligns the Android analytics, annual Player Stats builder, refresh-workflow integrity checks and documentation on the same six height bands.",
                  "- Retains year-specific Top 100 cohorts, pooled Hold%/Break%/H+B calculations, sample coverage, surface filters, player search and automatic live result/stat updates.",
                  "- Preserves the CPI and Surface Speed formulas, live ATP rating path and pace datasets.",
                  "- Retains the private personal/non-commercial boundary for TennisMyLife-derived Player Stats data.",
                  "",
              ]
          else:
              lines += [
                  "### Included",
                  "- See the commits included in this release for the changes delivered in this version.",
                  "",
              ]

          lines += [
              "### Build verification",
              f"- Version: **{version}** (versionCode {version_code})",
              f"- Package: `{package}`",
              f"- APK: `{asset}`",
              f"- SHA-256: `{sha256}`",
              "",
          ]

          if key_transition:
              lines += [
                  "### Signing-key transition",
                  "This APK uses a newly generated replacement key. Android does not permit in-place updates across different signing certificates; uninstall the previously installed app before installing this APK. Download the private Actions recovery artifact, configure the four repository Actions secrets from its GITHUB_ACTIONS_SECRETS.txt, and keep an offline backup. Never share the artifact or credentials.",
                  "",
              ]
          else:
              lines += [
                  "This APK uses the retained Court Pace signing certificate and supports in-place upgrades from releases signed with the same certificate.",
                  "",
              ]

          notes = "\n".join(lines) + "\n"
          required = [
              f"- Package: `{package}`",
              f"- APK: `{asset}`",
              f"- SHA-256: `{sha256}`",
          ]
          if any(item not in notes for item in required):
              raise SystemExit("Release notes are missing package, APK, or checksum metadata.")
          Path(os.environ["RUNNER_TEMP"], "RELEASE_NOTES.md").write_text(
              notes, encoding="utf-8"
          )
          PY

      - name: Publish stable GitHub release and APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Court Pace ${{ steps.meta.outputs.version }} — Player Stats and automatic live ATP updates
          body_path: ${{ runner.temp }}/RELEASE_NOTES.md
          files: ${{ steps.verify.outputs.apk }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
