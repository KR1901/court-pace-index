name: Release signed Android APK

on:
  push:
    branches: [main]
    paths:
      - "app/build.gradle.kts"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: court-pace-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify repository privacy before handling signing material
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          private="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')"
          if [[ "$private" != "true" ]]; then
            echo "::error::Release blocked: make this personal-use repository private before a new signing key is generated or stored as an Actions artifact."
            exit 1
          fi
          echo "Repository is private; signing material can be handled safely."

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read version metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          from pathlib import Path

          text = Path("app/build.gradle.kts").read_text(encoding="utf-8")
          code = re.search(r"\bversionCode\s*=\s*(\d+)", text)
          name = re.search(r'\bversionName\s*=\s*"([^"]+)"', text)
          if not code or not name:
              raise SystemExit("Could not read Android versionCode/versionName")
          version_code = int(code.group(1))
          version_name = name.group(1)
          if not re.fullmatch(r"\d+\.\d+\.\d+", version_name):
              raise SystemExit(f"Expected stable semantic version, got {version_name!r}")
          print(f"version={version_name}")
          print(f"version_code={version_code}")
          print(f"tag=v{version_name}")
          PY

      - name: Check release tag is unused
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists. Bump versionCode/versionName before publishing another release."
            exit 1
          fi

      - name: Restore an existing signing key or create the new permanent key
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.COURT_PACE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.COURT_PACE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.COURT_PACE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.COURT_PACE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keyfile="$RUNNER_TEMP/court-pace-release.jks"
          recovery="$RUNNER_TEMP/signing-recovery"
          mkdir -p "$recovery"

          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keyfile"
            keytool -list -keystore "$keyfile" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
            echo "generated=false" >> "$GITHUB_OUTPUT"
            echo "Existing release signing key restored."
          elif [[ -z "$KEYSTORE_BASE64" && -z "$KEYSTORE_PASSWORD" && -z "$KEY_ALIAS" && -z "$KEY_PASSWORD" ]]; then
            KEYSTORE_PASSWORD="$(openssl rand -hex 32)"
            KEY_PASSWORD="$(openssl rand -hex 32)"
            KEY_ALIAS="courtpace"
            keytool -genkeypair -v \
              -keystore "$keyfile" \
              -storetype JKS \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 3072 -validity 10000 \
              -dname "CN=Court Pace, OU=Personal, O=KR1901, L=Bilaspur, ST=Chhattisgarh, C=IN"
            base64 -w 0 "$keyfile" > "$recovery/COURT_PACE_KEYSTORE_BASE64.txt"
            cat > "$recovery/COURT_PACE_SIGNING_SECRETS.txt" <<EOF
          COURT_PACE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD
          COURT_PACE_KEY_ALIAS=$KEY_ALIAS
          COURT_PACE_KEY_PASSWORD=$KEY_PASSWORD
          EOF
            cp "$keyfile" "$recovery/court-pace-signing-key.jks"
            chmod 600 "$recovery/"*
            echo "generated=true" >> "$GITHUB_OUTPUT"
            echo "A new permanent release signing key was generated. Save the private recovery artifact and configure repository secrets before the next release."
          else
            echo "::error::Signing secrets are only partially configured. Set all four COURT_PACE signing secrets or clear all four to generate a new key."
            exit 1
          fi

          {
            echo "COURT_PACE_KEYSTORE=$keyfile"
            echo "COURT_PACE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "COURT_PACE_KEY_ALIAS=$KEY_ALIAS"
            echo "COURT_PACE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "KEY_RECOVERY_DIR=$recovery" >> "$GITHUB_ENV"

      - name: Run unit tests and assemble signed production APK
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --stacktrace

      - name: Verify production package, version and APK signature
        id: verify
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$build_tools/apksigner" verify --verbose --print-certs "$apk"
          "$build_tools/aapt" dump badging "$apk" | head -n 1 | tee package.txt
          grep -F "name='ink.courtpace.index'" package.txt
          grep -F "versionCode='$VERSION_CODE'" package.txt
          grep -F "versionName='$VERSION'" package.txt
          mkdir -p "$RUNNER_TEMP/release"
          cp "$apk" "$RUNNER_TEMP/release/court-pace-$VERSION.apk"
          sha256sum "$RUNNER_TEMP/release/court-pace-$VERSION.apk" | tee "$RUNNER_TEMP/release/SHA256SUMS.txt"
          echo "apk=$RUNNER_TEMP/release/court-pace-$VERSION.apk" >> "$GITHUB_OUTPUT"
          echo "sha256=$(cut -d' ' -f1 "$RUNNER_TEMP/release/SHA256SUMS.txt")" >> "$GITHUB_OUTPUT"

      - name: Retain the new signing key for recovery
        if: steps.signing.outputs.generated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: court-pace-release-signing-key-v${{ steps.meta.outputs.version }}
          path: |
            ${{ env.KEY_RECOVERY_DIR }}/court-pace-signing-key.jks
            ${{ env.KEY_RECOVERY_DIR }}/COURT_PACE_KEYSTORE_BASE64.txt
            ${{ env.KEY_RECOVERY_DIR }}/COURT_PACE_SIGNING_SECRETS.txt
          if-no-files-found: error
          retention-days: 90

      - name: Prepare release notes
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          SHA256: ${{ steps.verify.outputs.sha256 }}
          NEW_KEY: ${{ steps.signing.outputs.generated }}
        run: |
          cat > "$RUNNER_TEMP/RELEASE_NOTES.md" <<EOF
          ## Court Pace $VERSION

          Production release from the merged main branch.

          ### Included
          - More reliable live ATP 1000/500/250 match discovery and coverage diagnostics.
          - Generic played-retirement inclusion and walkover/no-play exclusion with validated match statistics.
          - Calibrated expected-aces Surface Speed methodology and historical player-profile calculations.
          - Expanded calculation diagnostics, historical coverage audits and refreshed tournament/CPI data.
          - Consistent tournament calculation diagnostics and paired CPI/Surface Speed comparison improvements.

          ### Build
          - Version: **$VERSION** (versionCode $VERSION_CODE)
          - Package: `ink.courtpace.index`
          - Asset: `court-pace-$VERSION.apk`
          - SHA-256: `$SHA256`

          EOF
          if [[ "$NEW_KEY" == "true" ]]; then
            cat >> "$RUNNER_TEMP/RELEASE_NOTES.md" <<'EOF'
          ### Signing-key transition
          The previous signing key was unavailable. This APK uses a newly generated permanent signing key. **Uninstall Court Pace 3.1.0 before installing this release**; Android will not accept an APK signed with a different certificate as an in-place update. A restricted 90-day Actions recovery artifact named `court-pace-release-signing-key-v$VERSION` contains the new key and its credentials. Download it and configure the four `COURT_PACE_*` repository secrets for future in-place upgrades. Store a separate offline backup.
          EOF
          else
            cat >> "$RUNNER_TEMP/RELEASE_NOTES.md" <<'EOF'
          This APK uses the previously configured release signing key and should preserve Android update compatibility.
          EOF
          fi

      - name: Publish stable GitHub release and APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Court Pace ${{ steps.meta.outputs.version }} — calibrated Surface Speed and live match coverage
          body_path: ${{ runner.temp }}/RELEASE_NOTES.md
          files: ${{ steps.verify.outputs.apk }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
