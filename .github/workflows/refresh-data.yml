# Davis Cup Final 8 is its own live target; keep this branch's generated phase-separated ratings in sync with refreshed match-source data.
name: Refresh dataset

# Regenerates the bundled dataset from the public match archive and source year tables,
# then publishes the validated payload consumed by the app. Runs every six hours and on demand.
# A successful push-triggered refresh hands off to the signed APK release workflow;
# a scheduled refresh updates the dataset but does not publish a new APK.
# If main advances during a refresh and the generated commit cannot be rebased safely,
# start a fresh run from the latest main tip; never force-push over concurrent app/data changes.

on:
  push:
    branches: [main, fix/live-tournament-discovery-and-refresh, analysis/expected-aces-formula-comparison, fix/nextgen-finals-live-and-archive-calcs, fix/courtspeed-rome-cpi-alias, fix/davis-cup-tml-live-and-loeo-research, fix/chronological-loeo-davis-cup-coverage, fix/match-day-chronology-no-arbitrary-quarantine, fix/exact-match-date-loeo-chronology, feature/davis-cup-final8-separation]
    paths:
      # Calculation, dataset, test-guard and refresh-workflow changes run a full data rebuild.
      - 'tools/compute_speed.py'
      - 'tools/chronological_loeo_study.py'
      - 'tools/davis_cup_policy.py'
      - 'tools/test_compute_speed.py'
      - 'app/src/main/java/ink/courtpace/index/core/data/PaceData.kt'
      - 'app/src/main/java/ink/courtpace/index/data/TmlDavisCupClient.kt'
      - 'app/src/main/java/ink/courtpace/index/core/live/LiveRatingCache.kt'
      - 'app/src/main/java/ink/courtpace/index/ui/AppViewModel.kt'
      - 'app/src/test/java/ink/courtpace/index/core/TmlDavisCupClientTest.kt'
      - 'tools/build_dataset.py'
      - 'tools/fetch_reference_data.py'
      - 'app/src/test/java/ink/courtpace/index/core/DatasetPolicyTest.kt'
      - 'app/src/test/java/ink/courtpace/index/core/DatasetTest.kt'
      # Version changes must run the validated dataset gate before signed release.
      - 'app/build.gradle.kts'
      - '.github/workflows/refresh-data.yml'
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Never let two dataset refreshes race to publish generated files to the same branch.
# A newer main revision supersedes an older archive rebuild; keep the published dataset
# aligned with the latest calculator and metadata code instead of queueing stale work.
concurrency:
  group: court-pace-dataset-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test live player profile fallback
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v

      - name: Compare retrospective and chronological LOEO methods
        run: |
          python3 tools/chronological_loeo_study.py \
            --start-year 2016 \
            --end-year "$(date -u +%Y)" \
            --output build/chronological-loeo-study.json

      - name: Upload LOEO methodology research
        uses: actions/upload-artifact@v4
        with:
          name: chronological-loeo-study-current
          path: build/chronological-loeo-study.json
          if-no-files-found: error
          retention-days: 90

      - name: Refresh calendar-year TA and CPI source tables
        run: python3 tools/fetch_reference_data.py --start-year 1991 --end-year "$(date -u +%Y)"

      - name: Refresh live event manifest timestamp for baseline freshness
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path("data/live.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          payload["generated"] = datetime.now(timezone.utc).isoformat(timespec="seconds").replace("+00:00", "Z")
          path.write_text(json.dumps(payload, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY

      - name: Recompute the speed series from the match archive
        run: python3 tools/compute_speed.py --write

      - name: Validate the generated season baseline
        run: |
          python3 - <<'PY'
          import hashlib, json, math, unicodedata
          from datetime import date, datetime, timezone
          from pathlib import Path

          path = Path("data/live_speed_baseline.json")
          assert path.is_file(), "the live opponent-adjustment baseline was not generated"
          baseline = json.loads(path.read_text())
          season = date.today().year
          assert baseline.get("season") == season, f"expected season {season}, got {baseline.get('season')}"
          assert baseline.get("profileSeason") in (season, season - 1), "unexpected player-profile season"
          normalisation = baseline.get("normalisation")
          assert isinstance(normalisation, (int, float)) and math.isfinite(normalisation) and normalisation > 0
          tour_rate = baseline.get("tourAceRate")
          assert isinstance(tour_rate, (int, float)) and math.isfinite(tour_rate) and 0 < tour_rate < 1, (
              "the calibrated live baseline must include a valid season tour-average ace rate"
          )
          assert baseline.get("ratedEvents", 0) >= 5, "too few rated events to establish a stable normaliser"
          assert baseline.get("profileHistoryStartYear") == 1991, "profile archive window must start in 1991"
          assert baseline.get("profileHistoryDecayPerYear") == 0.90, "historical profile decay must match the documented 0.90 factor"
          assert baseline.get("profileHistoryYearsLoaded", 0) >= 30, "too few historical profile seasons were loaded"
          assert baseline.get("profilePriorServicePoints") == 150.0, "live baseline prior must match the audited 150-point value"
          assert baseline.get("liveProfilePriorServicePoints") == 150.0, "live low-sample prior must match the audited 150-point value"
          assert isinstance(baseline.get("liveFeedFresh"), bool), "live baseline must record manifest freshness"
          assert isinstance(baseline.get("excludedEventIds"), list), "live baseline must record excluded active event IDs"
          assert baseline.get("profileTrainingMatches", 0) > 0, "live baseline training sample is empty"
          if not baseline["liveFeedFresh"]:
              assert baseline.get("profileSeason") == season - 1, "stale event manifest must fall back to the previous completed season"
          profiles = baseline.get("profiles")
          assert isinstance(profiles, list) and len(profiles) >= 20, "too few player profiles were generated"
          normalized_names = [
              "".join(ch for ch in unicodedata.normalize("NFKD", p.get("name", "")).casefold() if ch.isalnum())
              for p in profiles
          ]
          assert all(normalized_names) and len(set(normalized_names)) == len(normalized_names), (
              "duplicate or blank normalized player names remain in the live baseline"
          )
          usable = [p for p in profiles if p.get("name") and
                    (p.get("serveRate") is not None or p.get("concedeRate") is not None)]
          assert len(usable) >= 20, "too few usable player profiles were generated"
          source_metadata = baseline.get("sourceMetadata")
          if source_metadata:
              fetched = datetime.fromisoformat(source_metadata["fetchedAtUtc"].replace("Z", "+00:00"))
              age = datetime.now(timezone.utc) - fetched
              assert age.total_seconds() >= -900 and age.total_seconds() <= 7 * 86400, (
                  f"TML baseline snapshot is outside the seven-day freshness window: {age}"
              )
              print(f"Source snapshot fetched: {source_metadata['fetchedAtUtc']}")
              print(f"Source match rows: {source_metadata.get('matchRows')}, latest match date: "
                    f"{source_metadata.get('latestMatchDate')}, SHA-256: {source_metadata.get('sha256')}")
              assert source_metadata.get("latestMatchDate"), "source snapshot has no dated match observations"
              assert source_metadata.get("matchRows", 0) > 0, "source snapshot is empty"
              csv_path = Path(f".cache/atp/tml_atp_matches_{season}.csv")
              assert csv_path.is_file(), "TML source CSV is missing from the refresh workspace"
              source_bytes = csv_path.read_bytes()
              assert len(source_bytes) == source_metadata.get("bytes"), "TML source byte count mismatch"
              assert hashlib.sha256(source_bytes).hexdigest() == source_metadata.get("sha256"), (
                  "TML source SHA-256 does not match the recorded source manifest"
              )
          coverage = baseline.get("profileCoverage") or {}
          assert coverage.get("playerProfiles") == len(profiles), "profile coverage count does not match the baseline"
          assert coverage.get("ambiguousNameCollisionsExcluded", 0) >= 0, (
              "ambiguous name-collision diagnostic must be present and non-negative"
          )
          assert coverage.get("withoutServeRate") == 0, (
              f"{coverage.get('withoutServeRate')} active baseline profiles still lack a server rate"
          )
          assert coverage.get("withoutConcedeRate") == 0, (
              f"{coverage.get('withoutConcedeRate')} active baseline profiles still lack a return-concession rate"
          )
          assert coverage.get("currentSeasonQualifiedServeProfiles", 0) + \
                 coverage.get("careerHistorySurfaceShrunkServeProfiles", 0) + \
                 coverage.get("careerHistoryPooledShrunkServeProfiles", 0) + \
                 coverage.get("tourAveragePriorOnlyProfiles", 0) == len(profiles), \
                 "expanded player profile source counts do not add up"
          for profile in usable:
              for key in ("serveRate", "concedeRate"):
                  value = profile.get(key)
                  valid = value is None or (
                      isinstance(value, (int, float)) and math.isfinite(value) and 0 <= value <= 1
                  )
                  assert valid, f"invalid {key} for {profile.get('name')}"
          print(f"Baseline OK: season={season}, profileSeason={baseline['profileSeason']}, "
                f"profiles={len(usable)}, events={baseline['ratedEvents']}, normalisation={normalisation:.6f}")
          PY

      - name: Rebuild the dataset
        run: python3 tools/build_dataset.py

      - name: Publish the file the app refreshes from
        run: cp app/src/main/assets/pace_dataset.json data/latest.json

      - name: Verify published dataset carries the same baseline
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          baseline = json.loads(Path("data/live_speed_baseline.json").read_text())
          history = json.loads(Path("data/speed_history.json").read_text())
          initial = json.loads(Path("app/src/main/assets/pace_dataset.json").read_text())
          current_season = str(baseline.get("season"))
          dc_audit = (history.get("davis_cup_coverage") or {}).get(current_season)
          assert isinstance(dc_audit, dict), "current season Davis Cup source reconciliation is missing"
          assert dc_audit.get("sourceRowsAfterMerge") == (
              dc_audit.get("excludedDoubles", 0) +
              dc_audit.get("rowsWithoutPlayerIds", 0) +
              dc_audit.get("identifiedSingles", 0)
          ), "Davis Cup post-merge source rows do not reconcile to excluded doubles, unidentified rows and unique singles"
          assert dc_audit.get("identifiedSingles") == (
              dc_audit.get("completedPlayedSingles", 0) +
              dc_audit.get("scorelessSingles", 0) +
              dc_audit.get("walkoverOrNoPlaySingles", 0)
          ), "Davis Cup identified singles do not reconcile to played, scoreless and no-play buckets"
          assert dc_audit.get("completedPlayedSingles") == (
              dc_audit.get("completedWithValidServeStats", 0) +
              dc_audit.get("completedMissingServeStats", 0) +
              dc_audit.get("completedMalformedStats", 0)
          ), "Davis Cup completed singles do not reconcile to valid, missing and malformed stats"
          assert dc_audit.get("validatedSource") is True, (
              "2026 Davis Cup source has not passed TML annual + ongoing-feed validation"
          )
          phases = dc_audit.get("phases") or {}
          rest_audit = phases.get("restOfDavisCup")
          final8_audit = phases.get("final8")
          assert isinstance(rest_audit, dict) and isinstance(final8_audit, dict), (
              "2026 Davis Cup source reconciliation must report separate earlier-competition and Final 8 populations"
          )
          phase_count_keys = (
              "sourceRowsAfterMerge", "excludedDoubles", "rowsWithoutPlayerIds",
              "identifiedSingles", "scorelessSingles", "walkoverOrNoPlaySingles",
              "completedPlayedSingles", "completedWithValidServeStats",
              "completedMissingServeStats", "completedMalformedStats",
          )
          for key in phase_count_keys:
              assert dc_audit.get(key, 0) == (
                  rest_audit.get(key, 0) + final8_audit.get(key, 0)
              ), f"Davis Cup phase counts do not reconcile for {key}"
              for phase_name, phase_audit in (
                  ("earlier Davis Cup", rest_audit), ("Final 8", final8_audit)
              ):
                  assert phase_audit.get("identifiedSingles", 0) == (
                      phase_audit.get("completedPlayedSingles", 0)
                      + phase_audit.get("scorelessSingles", 0)
                      + phase_audit.get("walkoverOrNoPlaySingles", 0)
                  ), f"{phase_name} identified singles do not reconcile"
                  assert phase_audit.get("completedPlayedSingles", 0) == (
                      phase_audit.get("completedWithValidServeStats", 0)
                      + phase_audit.get("completedMissingServeStats", 0)
                      + phase_audit.get("completedMalformedStats", 0)
                  ), f"{phase_name} played singles do not reconcile"
          history_season = history.get("seasons", {}).get(current_season, {})
          dc_values = history_season.get("daviscup")
          final8_values = history_season.get("daviscupfinal8")
          assert dc_values and dc_values.get("speed") is not None, (
              "validated 2026 earlier Davis Cup feed did not produce a historical CALC rating"
          )
          assert final8_values and final8_values.get("speed") is not None, (
              "validated 2026 Final 8 feed did not produce a separate historical CALC rating"
          )
          assert dc_values.get("matches", 0) == rest_audit.get("completedWithValidServeStats"), (
              "Earlier Davis Cup CALC match count differs from its valid-stat source population"
          )
          assert final8_values.get("matches", 0) == final8_audit.get("completedWithValidServeStats"), (
              "Final 8 CALC match count differs from its valid-stat source population"
          )
          assert final8_audit.get("identifiedSingles", 0) > 0, (
              "No Final 8 singles have been identified in the validated TML source"
          )
          print(
              "Davis Cup phase audit · earlier: "
              f"{rest_audit.get('identifiedSingles')} identified / "
              f"{rest_audit.get('completedWithValidServeStats')} valid stats / "
              f"{rest_audit.get('completedMissingServeStats')} missing · Final 8: "
              f"{final8_audit.get('identifiedSingles')} identified / "
              f"{final8_audit.get('completedWithValidServeStats')} valid stats / "
              f"{final8_audit.get('completedMissingServeStats')} missing"
          )
          known = {item["id"] for item in initial["tournaments"]}
          dataset_bytes = Path("app/src/main/assets/pace_dataset.json").read_bytes()
          assert Path("data/latest.json").read_bytes() == dataset_bytes, "data/latest.json differs from the bundled dataset"

          for filename in ("app/src/main/assets/pace_dataset.json", "data/latest.json"):
              dataset = json.loads(Path(filename).read_text())
              embedded = dataset.get("speedBaseline")
              assert embedded, f"{filename} is missing speedBaseline"
              assert dataset["meta"]["season"] == baseline["season"]
              assert embedded["season"] == baseline["season"]
              assert embedded["generated"] == baseline["generated"]
              assert embedded["tourAceRate"] == baseline["tourAceRate"]
              assert len(embedded["profiles"]) == len(baseline["profiles"])

              indexed = {(row["t"], int(row["s"])): row for row in dataset["readings"]}
              checked = 0
              for season, events in history["seasons"].items():
                  for tournament_id, values in events.items():
                      if tournament_id not in known:
                          continue
                      row = indexed.get((tournament_id, int(season)))
                      if values.get("speed") is not None:
                          assert row is not None, f"{filename} missing CALC {season}/{tournament_id}"
                          assert row.get("src") == "computed", f"{filename} has stale/non-CALC source for {season}/{tournament_id}"
                          assert row.get("speed") == round(values["speed"], 3), f"{filename} stale CALC speed for {season}/{tournament_id}"
                          assert row.get("adjustedServerSides") == values.get("adjustedServerSides"), f"{filename} stale side coverage for {season}/{tournament_id}"
                          assert row.get("matches") == values.get("matches"), f"{filename} stale match count for {season}/{tournament_id}"
                          assert row.get("speedCiLow") == values.get("speedCiLow"), f"{filename} stale lower interval for {season}/{tournament_id}"
                          assert row.get("speedCiHigh") == values.get("speedCiHigh"), f"${filename} stale upper interval for ${season}/${tournament_id}"
                          diagnostics = values.get("calculationDiagnostics")
                          assert isinstance(diagnostics, dict), f"${season}/${tournament_id} missing historical calculation diagnostics"
                          assert diagnostics.get("completedMatches") == values.get("matches")
                          assert diagnostics.get("adjustedServerSides") == values.get("adjustedServerSides")
                          assert diagnostics.get("totalServerSides") == values.get("matches", 0) * 2
                          assert diagnostics.get("sideDiagnostics"), f"${season}/${tournament_id} has no retained influential sides"
                          assert len(diagnostics["sideDiagnostics"]) <= 20
                          assert row.get("calculationDiagnostics") == diagnostics, f"${filename} stale detail diagnostics for ${season}/${tournament_id}"
                          checked += 1
                      elif values.get("provisionalSpeed") is not None:
                          assert row is not None, f"{filename} missing provisional {season}/{tournament_id}"
                          assert row.get("provisionalSpeed") == round(values["provisionalSpeed"], 3), f"{filename} stale provisional speed for {season}/{tournament_id}"
                          assert row.get("provisionalServerSides") == values.get("provisionalServerSides"), f"{filename} stale provisional coverage for {season}/{tournament_id}"
              required_calc = {
                  (2020, "rio"): 31,
                  (2022, "adelaide"): 54,
                  (2023, "adelaide"): 58,
                  (2026, "atpfinals"): 15,
                  (2026, "daviscup"): 1,
                  (2026, "daviscupfinal8"): 1,
              }
              for (required_season, required_event), minimum_matches in required_calc.items():
                  values = history["seasons"].get(str(required_season), {}).get(required_event)
                  assert values and values.get("speed") is not None, (
                      f"{filename} missing restored CALC {required_season}/{required_event}"
                  )
                  assert values.get("matches", 0) >= minimum_matches, (
                      f"{filename} has partial archive coverage for {required_season}/{required_event}: "
                      f"{values.get('matches', 0)} of at least {minimum_matches} matches"
                  )
                  assert values.get("adjustedServerSides") == values.get("matches", 0) * 2
                  restored = indexed.get((required_event, required_season))
                  assert restored and restored.get("src") == "computed", (
                      f"{filename} did not publish CALC {required_season}/{required_event}"
                  )
              assert checked > 0, f"{filename} has no calculated readings"
          print(f"Bundled and downloadable datasets contain the validated baseline and {checked} current CALC rows match speed_history.json.")
          PY

      - name: Diagnose generated dataset policy invariants
        run: |
          python3 - <<'PY'
          import json, math, unicodedata
          from pathlib import Path

          dataset = json.loads(Path("app/src/main/assets/pace_dataset.json").read_text())
          baseline = dataset.get("speedBaseline") or {}
          history = json.loads(Path("data/speed_history.json").read_text())
          readings = dataset.get("readings", [])
          ids = {item.get("id") for item in dataset.get("tournaments", [])}
          serve_sources = {
              "current-season-qualified", "prior-season-qualified", "current-season-shrunk",
              "prior-season-shrunk", "career-history-surface-shrunk",
              "career-history-pooled-shrunk", "tour-average-prior-only",
          }
          concede_sources = {
              "surface-qualified", "pooled-fallback", "career-history-surface-shrunk",
              "career-history-pooled-shrunk", "tour-average-prior-only",
          }
          normalized_names = [
              "".join(
                  ch for ch in unicodedata.normalize("NFD", str(p.get("name", ""))).casefold()
                  if ch.isalnum()
              )
              for p in baseline.get("profiles", [])
          ]
          bad_speeds = []
          bad_published = []
          for row in readings:
              speed = row.get("speed")
              if speed is not None and not (
                  isinstance(speed, (int, float)) and math.isfinite(speed) and speed >= 0.30 and
                  (speed <= 2.0 or (row.get("t") == "nextgen" and row.get("src") in ("computed", "live")))
              ):
                  bad_speeds.append({
                      "t": row.get("t"), "s": row.get("s"), "speed": speed,
                      "src": row.get("src"), "matches": row.get("matches"),
                      "adjustedServerSides": row.get("adjustedServerSides"),
                      "diagnostics": row.get("calculationDiagnostics"),
                  })
              published = row.get("publishedSpeed")
              if published is not None and not (
                  isinstance(published, (int, float)) and math.isfinite(published) and 0.30 <= published <= 2.0
              ):
                  bad_published.append({
                      "t": row.get("t"), "s": row.get("s"), "publishedSpeed": published,
                  })

          invalid_profile_sources = {
              "serve": sorted({
                  str(p.get("serveRateSource")) for p in baseline.get("profiles", [])
                  if p.get("serveRateSource") is not None and p.get("serveRateSource") not in serve_sources
              }),
              "concede": sorted({
                  str(p.get("concedeRateSource")) for p in baseline.get("profiles", [])
                  if p.get("concedeRateSource") is not None and p.get("concedeRateSource") not in concede_sources
              }),
          }
          duplicate_names = len(normalized_names) - len(set(normalized_names))
          invalid_rates = sum(
              1 for p in baseline.get("profiles", [])
              for key in ("serveRate", "concedeRate")
              if p.get(key) is not None and (
                  not isinstance(p[key], (int, float)) or not math.isfinite(p[key]) or not 0 <= p[key] <= 1
              )
          )
          invalid_seasons = sum(
              1 for p in baseline.get("profiles", [])
              for key in ("serveRateSeason", "concedeRateSeason")
              if p.get(key) is not None and not 1991 <= int(p[key]) <= int(baseline.get("season", 0))
          )

          current = str(baseline.get("season"))
          dc_audit = (history.get("davis_cup_coverage") or {}).get(current)
          current_values = (history.get("seasons") or {}).get(current, {})
          dc_calc = current_values.get("daviscup")
          final8_calc = current_values.get("daviscupfinal8")
          finals = current_values.get("atpfinals")
          ng24 = (history.get("seasons") or {}).get("2024", {}).get("nextgen")
          audit = {
              "dataset": {
                  "season": dataset.get("meta", {}).get("season"),
                  "tournaments": len(dataset.get("tournaments", [])),
                  "readings": len(readings),
                  "unknownTournamentRows": sum(1 for row in readings if row.get("t") not in ids),
                  "speedOutliers": bad_speeds[:50],
                  "speedOutlierCount": len(bad_speeds),
                  "publishedSpeedOutliers": bad_published[:50],
                  "publishedSpeedOutlierCount": len(bad_published),
              },
              "baseline": {
                  "season": baseline.get("season"),
                  "profileSeason": baseline.get("profileSeason"),
                  "profiles": len(baseline.get("profiles", [])),
                  "duplicateNormalizedNames": duplicate_names,
                  "invalidRates": invalid_rates,
                  "invalidProfileSeasons": invalid_seasons,
                  "invalidProfileSources": invalid_profile_sources,
                  "profileCoverage": baseline.get("profileCoverage"),
              },
              "atpFinals2026": finals,
              "nextGen2024": ng24,
              "davisCupAudit2026": dc_audit,
              "davisCupCalc2026": dc_calc,
              "davisCupRestCalc2026": dc_calc,
              "davisCupFinal8Calc2026": final8_calc,
          }
          Path("build").mkdir(exist_ok=True)
          Path("build/dataset-policy-audit.json").write_text(json.dumps(audit, indent=2) + "\n")
          print(json.dumps(audit, indent=2))
          PY

      - name: Upload generated dataset policy audit
        uses: actions/upload-artifact@v4
        with:
          name: dataset-policy-audit-current
          path: build/dataset-policy-audit.json
          if-no-files-found: error
          retention-days: 30

      - name: Verify
        run: |
          set -o pipefail
          # Retry known transient Maven/Robolectric downloads on cold runners.
          for attempt in 1 2 3; do
            log="$(mktemp)"
            if ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee "$log"; then
              rm -f "$log"
              exit 0
            fi
            if ! grep -Eq 'MavenArtifactFetcher|Could not GET|Read timed out|Connection reset|java.io.IOException' "$log"; then
              rm -f "$log"
              exit 1
            fi
            rm -f "$log"
            [ "$attempt" -lt 3 ] || break
            echo "Transient Maven/Robolectric download failure; retrying (attempt $((attempt + 1))/3)."
            sleep $((attempt * 10))
          done
          echo "Robolectric runtime download failed after three attempts."
          exit 1

      - name: Diagnose generated dataset and Android policy failures
        if: always()
        run: |
          python3 - <<'PY'
          import json, math, unicodedata
          from pathlib import Path

          dataset_path = Path("app/src/main/assets/pace_dataset.json")
          baseline_path = Path("data/live_speed_baseline.json")
          if not dataset_path.is_file() or not baseline_path.is_file():
              raise SystemExit("Generated dataset or baseline is missing.")
          dataset = json.loads(dataset_path.read_text(encoding="utf-8"))
          baseline = json.loads(baseline_path.read_text(encoding="utf-8"))
          readings = dataset.get("readings", [])
          profiles = baseline.get("profiles", [])
          speed = [row for row in readings if row.get("speed") is not None]
          computed = [row for row in speed if row.get("src") == "computed"]
          published = [row for row in speed if row.get("src") == "tennisabstract" or row.get("publishedSpeed") is not None]

          outliers = [
              {"t": row.get("t"), "s": row.get("s"), "speed": row.get("speed"), "src": row.get("src")}
              for row in speed
              if not (isinstance(row.get("speed"), (int, float)) and math.isfinite(row["speed"])
                      and row["speed"] >= 0.30
                      and (row["speed"] <= 2.0 or
                           (row.get("t") == "nextgen" and row.get("src") in {"computed", "live"})))
          ]
          published_outliers = [
              {"t": row.get("t"), "s": row.get("s"), "publishedSpeed": row.get("publishedSpeed")}
              for row in readings
              if row.get("publishedSpeed") is not None and
                 not (isinstance(row["publishedSpeed"], (int, float)) and
                      math.isfinite(row["publishedSpeed"]) and 0.30 <= row["publishedSpeed"] <= 2.0)
          ]
          cpi_outliers = [
              {"t": row.get("t"), "s": row.get("s"), "cpi": row.get("cpi")}
              for row in readings
              if row.get("cpi") is not None and
                 not (isinstance(row["cpi"], (int, float)) and 10.0 <= row["cpi"] <= 60.0)
          ]

          serve_sources = {
              "current-season-qualified", "prior-season-qualified",
              "current-season-shrunk", "prior-season-shrunk",
              "career-history-surface-shrunk", "career-history-pooled-shrunk",
              "tour-average-prior-only",
          }
          concede_sources = {
              "surface-qualified", "pooled-fallback",
              "career-history-surface-shrunk", "career-history-pooled-shrunk",
              "tour-average-prior-only",
          }
          normalized_names = [
              "".join(ch for ch in unicodedata.normalize("NFD", p.get("name", "")).lower()
                      if ch.isalnum())
              for p in profiles
          ]
          bad_profiles = []
          for p in profiles:
              issues = []
              for key in ("serveRate", "concedeRate"):
                  value = p.get(key)
                  if value is not None and (
                      not isinstance(value, (int, float)) or not math.isfinite(value) or not 0 <= value <= 1
                  ):
                      issues.append(f"invalid {key}")
              for key in ("serveRateSeason", "concedeRateSeason"):
                  value = p.get(key)
                  if value is not None and value not in range(1991, baseline.get("season", 0) + 1):
                      issues.append(f"invalid {key}={value}")
              for prefix in ("serveRate", "concedeRate"):
                  value = p.get(prefix + "SampleMatches")
                  rate = p.get(prefix[0].lower() + prefix[1:])
                  source = p.get(prefix + "Source")
                  if value is not None and (
                      value < 0 or (value == 0 and rate is not None and source != "tour-average-prior-only")
                  ):
                      issues.append(f"invalid {prefix}SampleMatches={value}")
                  points = p.get(prefix + "SampleServicePoints")
                  if points is not None and (
                      points < 0 or (points == 0 and rate is not None and source != "tour-average-prior-only")
                  ):
                      issues.append(f"invalid {prefix}SampleServicePoints={points}")
              source = p.get("serveRateSource")
              if source is not None and source not in serve_sources:
                  issues.append(f"unsupported serveRateSource={source}")
              source = p.get("concedeRateSource")
              if source is not None and source not in concede_sources:
                  issues.append(f"unsupported concedeRateSource={source}")
              if p.get("serveRatePriorServicePoints") is not None and p["serveRatePriorServicePoints"] <= 0:
                  issues.append("invalid serveRatePriorServicePoints")
              if p.get("concedeRatePriorServicePoints") is not None and p["concedeRatePriorServicePoints"] <= 0:
                  issues.append("invalid concedeRatePriorServicePoints")
              if issues:
                  bad_profiles.append({"name": p.get("name"), "issues": issues})

          print("GENERATED DATASET DIAGNOSTICS")
          print(f"tournaments={len(dataset.get('tournaments', []))} readings={len(readings)} "
                f"speed={len(speed)} computed={len(computed)} published-comparison={len(published)} "
                f"CPI={sum(row.get('cpi') is not None for row in readings)}")
          print(f"speed_outliers={outliers}")
          print(f"published_speed_outliers={published_outliers}")
          print(f"CPI_outliers={cpi_outliers}")
          print(f"baseline_profiles={len(profiles)} unique_normalized_names={len(set(normalized_names))} "
                f"usable_profiles={sum(p.get('serveRate') is not None or p.get('concedeRate') is not None for p in profiles)}")
          print(f"invalid_baseline_profiles={bad_profiles[:30]}")
          print(f"serve_sources={dict((source, sum(p.get('serveRateSource') == source for p in profiles)) for source in sorted(serve_sources))}")
          print(f"concede_sources={dict((source, sum(p.get('concedeRateSource') == source for p in profiles)) for source in sorted(concede_sources))}")
          print(f"2026_CALC={[(row['t'], row['matches'], row['speed']) for row in computed if row.get('s') == 2026]}")
          PY

      - name: Upload generated dataset and Android test reports for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-dataset-and-test-diagnostics
          path: |
            app/src/main/assets/pace_dataset.json
            app/build/test-results/testDebugUnitTest/*.xml
            data/live_speed_baseline.json
            data/speed_history.json
          if-no-files-found: warn
          retention-days: 14

      - name: Commit if anything changed
        run: |
          git config user.name "court-pace-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data app/src/main/assets/pace_dataset.json
          if git diff --cached --quiet; then
            echo "No change in the dataset."
            exit 0
          fi

          git commit -m "chore: refresh dataset from the match archive"
          branch="$GITHUB_REF_NAME"
          for attempt in 1 2 3; do
            git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch"
            if ! git rebase "origin/$branch"; then
              git rebase --abort || true
              echo "Could not safely rebase the generated dataset onto the latest $branch."
              exit 1
            fi
            if git push origin "HEAD:refs/heads/$branch"; then
              echo "Published the refreshed dataset to $branch."
              exit 0
            fi
            echo "Push raced with another branch update (attempt $attempt/3)."
            sleep $((attempt * 2))
          done
          echo "Could not publish the refreshed dataset after three attempts."
          exit 1
