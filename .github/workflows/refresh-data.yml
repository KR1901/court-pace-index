name: Refresh dataset

# Regenerates the bundled dataset from the public match archive and source year tables,
# then publishes the validated payload consumed by the app. Runs every six hours and on demand.
# If main advances during a refresh and the generated commit cannot be rebased safely,
# start a fresh run from the latest main tip; never force-push over concurrent app/data changes.

on:
  push:
    branches: [main, fix/live-tournament-discovery-and-refresh, analysis/expected-aces-formula-comparison, fix/nextgen-finals-live-and-archive-calcs, fix/courtspeed-rome-cpi-alias, fix/davis-cup-tml-live-and-loeo-research]
    paths:
      # Calculation, dataset, test-guard and refresh-workflow changes run a full data rebuild.
      - 'tools/compute_speed.py'
      - 'tools/davis_cup_policy.py'
      - 'tools/test_compute_speed.py'
      - 'app/src/main/java/ink/courtpace/index/core/data/PaceData.kt'
      - 'app/src/main/java/ink/courtpace/index/data/TmlDavisCupClient.kt'
      - 'app/src/main/java/ink/courtpace/index/core/live/LiveRatingCache.kt'
      - 'app/src/main/java/ink/courtpace/index/ui/AppViewModel.kt'
      - 'app/src/test/java/ink/courtpace/index/core/TmlDavisCupClientTest.kt'
      - 'tools/build_dataset.py'
      - 'tools/fetch_reference_data.py'
      - 'app/src/test/java/ink/courtpace/index/core/DatasetPolicyTest.kt'
      # Version changes must run the validated dataset gate before signed release.
      - 'app/build.gradle.kts'
      - '.github/workflows/refresh-data.yml'
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Never let two dataset refreshes race to publish generated files to the same branch.
concurrency:
  group: court-pace-dataset-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test live player profile fallback
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v

      - name: Compare retrospective and chronological LOEO methods
        run: |
          python3 tools/chronological_loeo_study.py \
            --start-year 2016 \
            --end-year 2025 \
            --quarantine-days 14 \
            --output build/chronological-loeo-2016-2025.json

      - name: Upload LOEO methodology research
        uses: actions/upload-artifact@v4
        with:
          name: chronological-loeo-study-2016-2025
          path: build/chronological-loeo-2016-2025.json
          if-no-files-found: error
          retention-days: 90

      - name: Refresh calendar-year TA and CPI source tables
        run: python3 tools/fetch_reference_data.py --start-year 1991 --end-year "$(date -u +%Y)"

      - name: Refresh live event manifest timestamp for baseline freshness
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path("data/live.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          payload["generated"] = datetime.now(timezone.utc).isoformat(timespec="seconds").replace("+00:00", "Z")
          path.write_text(json.dumps(payload, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY

      - name: Recompute the speed series from the match archive
        run: python3 tools/compute_speed.py --write

      - name: Validate the generated season baseline
        run: |
          python3 - <<'PY'
          import hashlib, json, math, unicodedata
          from datetime import date, datetime, timezone
          from pathlib import Path

          path = Path("data/live_speed_baseline.json")
          assert path.is_file(), "the live opponent-adjustment baseline was not generated"
          baseline = json.loads(path.read_text())
          season = date.today().year
          assert baseline.get("season") == season, f"expected season {season}, got {baseline.get('season')}"
          assert baseline.get("profileSeason") in (season, season - 1), "unexpected player-profile season"
          normalisation = baseline.get("normalisation")
          assert isinstance(normalisation, (int, float)) and math.isfinite(normalisation) and normalisation > 0
          tour_rate = baseline.get("tourAceRate")
          assert isinstance(tour_rate, (int, float)) and math.isfinite(tour_rate) and 0 < tour_rate < 1, (
              "the calibrated live baseline must include a valid season tour-average ace rate"
          )
          assert baseline.get("ratedEvents", 0) >= 5, "too few rated events to establish a stable normaliser"
          assert baseline.get("profileHistoryStartYear") == 1991, "profile archive window must start in 1991"
          assert baseline.get("profileHistoryDecayPerYear") == 0.90, "historical profile decay must match the documented 0.90 factor"
          assert baseline.get("profileHistoryYearsLoaded", 0) >= 30, "too few historical profile seasons were loaded"
          assert baseline.get("profilePriorServicePoints") == 150.0, "live baseline prior must match the audited 150-point value"
          assert baseline.get("liveProfilePriorServicePoints") == 150.0, "live low-sample prior must match the audited 150-point value"
          assert isinstance(baseline.get("liveFeedFresh"), bool), "live baseline must record manifest freshness"
          assert isinstance(baseline.get("excludedEventIds"), list), "live baseline must record excluded active event IDs"
          assert baseline.get("profileTrainingMatches", 0) > 0, "live baseline training sample is empty"
          if not baseline["liveFeedFresh"]:
              assert baseline.get("profileSeason") == season - 1, "stale event manifest must fall back to the previous completed season"
          profiles = baseline.get("profiles")
          assert isinstance(profiles, list) and len(profiles) >= 20, "too few player profiles were generated"
          normalized_names = [
              "".join(ch for ch in unicodedata.normalize("NFKD", p.get("name", "")).casefold() if ch.isalnum())
              for p in profiles
          ]
          assert all(normalized_names) and len(set(normalized_names)) == len(normalized_names), (
              "duplicate or blank normalized player names remain in the live baseline"
          )
          usable = [p for p in profiles if p.get("name") and
                    (p.get("serveRate") is not None or p.get("concedeRate") is not None)]
          assert len(usable) >= 20, "too few usable player profiles were generated"
          source_metadata = baseline.get("sourceMetadata")
          if source_metadata:
              fetched = datetime.fromisoformat(source_metadata["fetchedAtUtc"].replace("Z", "+00:00"))
              age = datetime.now(timezone.utc) - fetched
              assert age.total_seconds() >= -900 and age.total_seconds() <= 7 * 86400, (
                  f"TML baseline snapshot is outside the seven-day freshness window: {age}"
              )
              print(f"Source snapshot fetched: {source_metadata['fetchedAtUtc']}")
              print(f"Source match rows: {source_metadata.get('matchRows')}, latest match date: "
                    f"{source_metadata.get('latestMatchDate')}, SHA-256: {source_metadata.get('sha256')}")
              assert source_metadata.get("latestMatchDate"), "source snapshot has no dated match observations"
              assert source_metadata.get("matchRows", 0) > 0, "source snapshot is empty"
              csv_path = Path(f".cache/atp/tml_atp_matches_{season}.csv")
              assert csv_path.is_file(), "TML source CSV is missing from the refresh workspace"
              source_bytes = csv_path.read_bytes()
              assert len(source_bytes) == source_metadata.get("bytes"), "TML source byte count mismatch"
              assert hashlib.sha256(source_bytes).hexdigest() == source_metadata.get("sha256"), (
                  "TML source SHA-256 does not match the recorded source manifest"
              )
          coverage = baseline.get("profileCoverage") or {}
          assert coverage.get("playerProfiles") == len(profiles), "profile coverage count does not match the baseline"
          assert coverage.get("ambiguousNameCollisionsExcluded", 0) >= 0, (
              "ambiguous name-collision diagnostic must be present and non-negative"
          )
          assert coverage.get("withoutServeRate") == 0, (
              f"{coverage.get('withoutServeRate')} active baseline profiles still lack a server rate"
          )
          assert coverage.get("withoutConcedeRate") == 0, (
              f"{coverage.get('withoutConcedeRate')} active baseline profiles still lack a return-concession rate"
          )
          assert coverage.get("currentSeasonQualifiedServeProfiles", 0) + \
                 coverage.get("careerHistorySurfaceShrunkServeProfiles", 0) + \
                 coverage.get("careerHistoryPooledShrunkServeProfiles", 0) + \
                 coverage.get("tourAveragePriorOnlyProfiles", 0) == len(profiles), \
                 "expanded player profile source counts do not add up"
          for profile in usable:
              for key in ("serveRate", "concedeRate"):
                  value = profile.get(key)
                  valid = value is None or (
                      isinstance(value, (int, float)) and math.isfinite(value) and 0 <= value <= 1
                  )
                  assert valid, f"invalid {key} for {profile.get('name')}"
          print(f"Baseline OK: season={season}, profileSeason={baseline['profileSeason']}, "
                f"profiles={len(usable)}, events={baseline['ratedEvents']}, normalisation={normalisation:.6f}")
          PY

      - name: Rebuild the dataset
        run: python3 tools/build_dataset.py

      - name: Publish the file the app refreshes from
        run: cp app/src/main/assets/pace_dataset.json data/latest.json

      - name: Verify published dataset carries the same baseline
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          baseline = json.loads(Path("data/live_speed_baseline.json").read_text())
          history = json.loads(Path("data/speed_history.json").read_text())
          initial = json.loads(Path("app/src/main/assets/pace_dataset.json").read_text())
          known = {item["id"] for item in initial["tournaments"]}
          dataset_bytes = Path("app/src/main/assets/pace_dataset.json").read_bytes()
          assert Path("data/latest.json").read_bytes() == dataset_bytes, "data/latest.json differs from the bundled dataset"

          for filename in ("app/src/main/assets/pace_dataset.json", "data/latest.json"):
              dataset = json.loads(Path(filename).read_text())
              embedded = dataset.get("speedBaseline")
              assert embedded, f"{filename} is missing speedBaseline"
              assert dataset["meta"]["season"] == baseline["season"]
              assert embedded["season"] == baseline["season"]
              assert embedded["generated"] == baseline["generated"]
              assert embedded["tourAceRate"] == baseline["tourAceRate"]
              assert len(embedded["profiles"]) == len(baseline["profiles"])

              indexed = {(row["t"], int(row["s"])): row for row in dataset["readings"]}
              checked = 0
              for season, events in history["seasons"].items():
                  for tournament_id, values in events.items():
                      if tournament_id not in known:
                          continue
                      row = indexed.get((tournament_id, int(season)))
                      if values.get("speed") is not None:
                          assert row is not None, f"{filename} missing CALC {season}/{tournament_id}"
                          assert row.get("src") == "computed", f"{filename} has stale/non-CALC source for {season}/{tournament_id}"
                          assert row.get("speed") == round(values["speed"], 3), f"{filename} stale CALC speed for {season}/{tournament_id}"
                          assert row.get("adjustedServerSides") == values.get("adjustedServerSides"), f"{filename} stale side coverage for {season}/{tournament_id}"
                          assert row.get("matches") == values.get("matches"), f"{filename} stale match count for {season}/{tournament_id}"
                          assert row.get("speedCiLow") == values.get("speedCiLow"), f"{filename} stale lower interval for {season}/{tournament_id}"
                          assert row.get("speedCiHigh") == values.get("speedCiHigh"), f"${filename} stale upper interval for ${season}/${tournament_id}"
                          diagnostics = values.get("calculationDiagnostics")
                          assert isinstance(diagnostics, dict), f"${season}/${tournament_id} missing historical calculation diagnostics"
                          assert diagnostics.get("completedMatches") == values.get("matches")
                          assert diagnostics.get("adjustedServerSides") == values.get("adjustedServerSides")
                          assert diagnostics.get("totalServerSides") == values.get("matches", 0) * 2
                          assert diagnostics.get("sideDiagnostics"), f"${season}/${tournament_id} has no retained influential sides"
                          assert len(diagnostics["sideDiagnostics"]) <= 20
                          assert row.get("calculationDiagnostics") == diagnostics, f"${filename} stale detail diagnostics for ${season}/${tournament_id}"
                          checked += 1
                      elif values.get("provisionalSpeed") is not None:
                          assert row is not None, f"{filename} missing provisional {season}/{tournament_id}"
                          assert row.get("provisionalSpeed") == round(values["provisionalSpeed"], 3), f"{filename} stale provisional speed for {season}/{tournament_id}"
                          assert row.get("provisionalServerSides") == values.get("provisionalServerSides"), f"{filename} stale provisional coverage for {season}/{tournament_id}"
              required_calc = {
                  (2020, "rio"): 31,
                  (2022, "adelaide"): 54,
                  (2023, "adelaide"): 58,
              }
              for (required_season, required_event), minimum_matches in required_calc.items():
                  values = history["seasons"].get(str(required_season), {}).get(required_event)
                  assert values and values.get("speed") is not None, (
                      f"{filename} missing restored CALC {required_season}/{required_event}"
                  )
                  assert values.get("matches", 0) >= minimum_matches, (
                      f"{filename} has partial archive coverage for {required_season}/{required_event}: "
                      f"{values.get('matches', 0)} of at least {minimum_matches} matches"
                  )
                  assert values.get("adjustedServerSides") == values.get("matches", 0) * 2
                  restored = indexed.get((required_event, required_season))
                  assert restored and restored.get("src") == "computed", (
                      f"{filename} did not publish CALC {required_season}/{required_event}"
                  )
              assert checked > 0, f"{filename} has no calculated readings"
          print(f"Bundled and downloadable datasets contain the validated baseline and {checked} current CALC rows match speed_history.json.")
          PY

      - name: Verify
        run: |
          set -o pipefail
          # Retry known transient Maven/Robolectric downloads on cold runners.
          for attempt in 1 2 3; do
            log="$(mktemp)"
            if ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee "$log"; then
              rm -f "$log"
              exit 0
            fi
            if ! grep -Eq 'MavenArtifactFetcher|Could not GET|Read timed out|Connection reset|java.io.IOException' "$log"; then
              rm -f "$log"
              exit 1
            fi
            rm -f "$log"
            [ "$attempt" -lt 3 ] || break
            echo "Transient Maven/Robolectric download failure; retrying (attempt $((attempt + 1))/3)."
            sleep $((attempt * 10))
          done
          echo "Robolectric runtime download failed after three attempts."
          exit 1

      - name: Commit if anything changed
        run: |
          git config user.name "court-pace-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data app/src/main/assets/pace_dataset.json
          if git diff --cached --quiet; then
            echo "No change in the dataset."
            exit 0
          fi

          git commit -m "chore: refresh dataset from the match archive"
          branch="$GITHUB_REF_NAME"
          for attempt in 1 2 3; do
            git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch"
            if ! git rebase "origin/$branch"; then
              git rebase --abort || true
              echo "Could not safely rebase the generated dataset onto the latest $branch."
              exit 1
            fi
            if git push origin "HEAD:refs/heads/$branch"; then
              echo "Published the refreshed dataset to $branch."
              exit 0
            fi
            echo "Push raced with another branch update (attempt $attempt/3)."
            sleep $((attempt * 2))
          done
          echo "Could not publish the refreshed dataset after three attempts."
          exit 1
