name: One-time ATP official date-registry build

on:
  push:
    branches:
      - feature/atp-event-period-contract-pace-year-picker-20261127
    paths:
      - "tools/_atp_archive_cards.json"
      - "tools/_atp_archive_periods_build.py"
      - ".github/workflows/_build-atp-event-periods.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install location-to-IANA timezone helpers
        run: python -m pip install geonamescache timezonefinder
      - name: Build candidate registry from ATP official archive date cards
        run: |
          set -o pipefail
          python tools/_atp_archive_periods_build.py --write --report atp_event_periods_build_audit.json | tee atp_event_periods_build.log
      - name: Upload date crosswalk audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atp-official-date-registry-build-audit
          path: |
            atp_event_periods_build_audit.json
            atp_event_periods_build.log
            data/atp_event_periods.json
          if-no-files-found: warn
          retention-days: 7
      - name: Require 100% official date coverage before committing
        id: coverage_gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("atp_event_periods_build_audit.json").read_text(encoding="utf-8"))
          seasons = report.get("mappedBySeason", [])
          by_year = {int(row["season"]): row for row in seasons}
          expected_years = set(range(1991, 2027))
          missing_years = sorted(expected_years - set(by_year))
          incomplete = []
          for year, row in sorted(by_year.items()):
              if row.get("dateCoverageComplete") is not True:
                  incomplete.append({
                      "season": year,
                      "identifiedSourceEvents": row.get("identifiedSourceEvents"),
                      "coveredSourceEvents": row.get("coveredSourceEvents"),
                      "missing": row.get("coverageMissingSourceEventIds", [])[:20],
                      "unmatchedByLevel": row.get("unmatchedEventsByLevel", {}),
                  })
          if missing_years or incomplete:
              print("Missing seasons:", missing_years)
              print("Incomplete seasons:", json.dumps(incomplete, indent=2))
              raise SystemExit(
                  "Official ATP date mapping is incomplete. Candidate registry will not be committed."
              )
          print("PASS: all source event IDs across 1991–2026 have official ATP event periods.")
          PY
      - name: Commit partial official periods to PR branch for the single unresolved source event
        if: always() && steps.coverage_gate.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          registry_copy="$(mktemp)"
          cp data/atp_event_periods.json "$registry_copy"
          git fetch origin "$GITHUB_REF_NAME"
          git checkout -B "$GITHUB_REF_NAME" "origin/$GITHUB_REF_NAME"
          cp "$registry_copy" data/atp_event_periods.json
          git add data/atp_event_periods.json
          if git diff --cached --quiet; then
            echo "Partial registry unchanged; no commit needed."
          else
            git diff --cached --check
            git commit -m "data: stage ATP official event periods with one unresolved source event"
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
      - name: Commit the validated official date registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          registry_copy="$(mktemp)"
          cp data/atp_event_periods.json "$registry_copy"
          git fetch origin "$GITHUB_REF_NAME"
          git checkout -B "$GITHUB_REF_NAME" "origin/$GITHUB_REF_NAME"
          cp "$registry_copy" data/atp_event_periods.json
          git add data/atp_event_periods.json
          if git diff --cached --quiet; then
            echo "Registry unchanged; no commit needed."
          else
            git diff --cached --check
            git commit -m "data: populate verified ATP official event-period registry"
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
