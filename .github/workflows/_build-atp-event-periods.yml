name: One-time ATP official date-registry build

on:
  push:
    branches:
      - feature/atp-event-period-contract-pace-year-picker-20261127
    paths:
      - "tools/_atp_archive_cards.json"
      - "tools/_atp_archive_periods_build.py"
      - ".github/workflows/_build-atp-event-periods.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install location-to-IANA timezone helpers
        run: python -m pip install geonamescache timezonefinder
      - name: Build registry from official ATP dates and exact source IDs
        run: |
          set -o pipefail
          python tools/_atp_archive_periods_build.py --write --report atp_event_periods_build_audit.json | tee atp_event_periods_build.log
      - name: Add audit log to run summary
        if: always()
        run: |
          if [ -f atp_event_periods_build.log ]; then cat atp_event_periods_build.log >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload build audit
        uses: actions/upload-artifact@v4
        with:
          name: atp-official-date-registry-build-audit
          path: |
            atp_event_periods_build_audit.json
            atp_event_periods_build.log
          if-no-files-found: warn
          retention-days: 7
      - name: Commit generated registry to PR branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/atp_event_periods.json
          if git diff --cached --quiet; then
            echo "Registry unchanged; no commit needed."
          else
            git commit -m "data: populate ATP official event-period registry"
            git push origin "HEAD:$(git branch --show-current)"
          fi
