name: Expected-aces formula comparison

on:
  pull_request:
    branches:
      - fix/live-tournament-discovery-and-refresh
    paths:
      - ".github/workflows/speed-variant-analysis.yml"
      - "tools/compute_speed.py"
      - "tools/compare_speed_variants.py"
      - "tools/test_compare_speed_variants.py"
      - "tools/test_compute_speed.py"
      - "app/src/main/assets/pace_dataset.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out PR code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache ATP match archive
        uses: actions/cache@v4
        with:
          path: |
            .cache/atp
            .cache/tennisabstract
          key: tennis-history-${{ runner.os }}-${{ hashFiles('tools/compute_speed.py', 'tools/compare_speed_variants.py') }}
          restore-keys: |
            tennis-history-${{ runner.os }}-
      - name: Test production expected-aces calculation
        run: python3 -m unittest discover -s tools -p "test_compute_speed.py" -v
      - name: Test comparison methodology
        run: python3 -m unittest discover -s tools -p "test_compare_speed_variants.py" -v
      - name: Compare all archive seasons (1991-current) against annual Tennis Abstract tables
        run: |
          set -euo pipefail
          python3 tools/compare_speed_variants.py --seasons $(seq 1991 "$(date +%Y)") --reference-source tennisabstract --boot 5000 --baseline surface_returner | tee formula-comparison.txt
          cat formula-comparison.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload comparison output
        uses: actions/upload-artifact@v4
        with:
          name: expected-aces-formula-comparison-1991-2026
          path: formula-comparison.txt
          if-no-files-found: error
          retention-days: 30
