name: Refresh Player Stats

# Independent annual player archive refresh. This workflow never runs the CPI/Surface Speed
# builder and stages only the dedicated Player Stats JSON assets.
on:
  push:
    branches: [main, feature/player-stats-v2, feature/height-group-top-500-1000, feature/height-groups-expanded-data]
    paths:
      - 'tools/build_player_stats.py'
      - 'tools/test_build_player_stats.py'
      - 'tools/player_identity_overrides.json'
      - 'tools/player_height_overrides.json'
      - '.github/workflows/refresh-player-stats.yml'
  schedule:
    - cron: '0 9 * * 1'
  pull_request:
    branches: [main]
    paths:
      - 'tools/build_player_stats.py'
      - 'tools/test_build_player_stats.py'
      - 'tools/player_identity_overrides.json'
      - 'tools/player_height_overrides.json'
      - '.github/workflows/refresh-player-stats.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'KR1901/court-pace-index'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Player Stats tooling syntax
        run: python3 -m py_compile tools/build_player_stats.py tools/test_build_player_stats.py

      - name: Test Player Stats formulas and data validation
        run: python3 -m unittest discover -s tools -p 'test_build_player_stats.py' -v

      - name: Build independent annual Player Stats asset
        run: python3 tools/build_player_stats.py

      - name: Validate Player Stats files and data integrity
        run: |
          python3 - <<'PY'
          import json
          from datetime import date
          from pathlib import Path

          bundled = Path("app/src/main/assets/player_stats.json")
          published = Path("data/player_stats.json")
          assert bundled.is_file() and published.is_file(), "Player Stats JSON outputs are missing"
          assert bundled.read_bytes() == published.read_bytes(), "bundled and published Player Stats files differ"

          payload = json.loads(bundled.read_text(encoding="utf-8"))
          players = payload.get("players")
          meta = payload.get("meta") or {}
          assert isinstance(players, list) and len(players) >= 100
          ids = [row.get("id") for row in players]
          assert all(isinstance(value, str) and value for value in ids), "blank player ID"
          assert len(set(ids)) == len(ids), "duplicate player IDs"

          snapshots = meta.get("top100SeasonSnapshots")
          assert isinstance(snapshots, list) and snapshots, "year-specific Top-100 snapshots are missing"
          snapshot_years = [row.get("year") for row in snapshots]
          first_top100_year = meta.get("firstTop100Season")
          current_year = meta.get("lastSeason")
          expected_years = list(range(first_top100_year, current_year + 1))
          assert snapshot_years == expected_years, "every ranking season must have exactly one ordered snapshot"

          ranks_by_player = {}
          for player in players:
              entries = player.get("top100RanksBySeason") or []
              years = [entry.get("y") for entry in entries]
              assert len(years) == len(set(years)), f"duplicate Top-100 season for {player.get('id')}"
              ranks_by_player[player["id"]] = {entry["y"]: entry["rank"] for entry in entries}

          for snapshot in snapshots:
              year = snapshot["year"]
              snapshot_date = date.fromisoformat(snapshot["asOf"])
              assert snapshot_date.year == year, f"{year} cohort must use a ranking date from that year"
              assert snapshot.get("source") == (
                  "https://stats.tennismylife.org/api/ranking?date=" + snapshot_date.isoformat()
              )
              members = [
                  (player_id, ranks[year])
                  for player_id, ranks in ranks_by_player.items()
                  if year in ranks
              ]
              unresolved = snapshot.get("unresolvedPlayers", 0)
              ranked_entries = len(members) + unresolved
              assert unresolved >= 0
              assert ranked_entries >= 100, (
                  f"{year} rank-100 cohort has fewer than 100 ranked entries"
              )
              assert all(1 <= rank <= 100 for _, rank in members), (
                  f"{year} cohort contains a rank outside 1–100"
              )
              assert snapshot.get("players") == len(members), (
                  f"{year} identified player count does not match player-level membership"
              )
              assert snapshot.get("rankedEntries") == ranked_entries, (
                  f"{year} ranked-entry total does not match identified plus unresolved entries"
              )

          current_snapshot = snapshots[-1]
          assert current_snapshot["year"] == current_year
          assert current_snapshot["asOf"] == meta.get("currentTop100AsOf")
          assert current_snapshot["source"] == meta.get("currentTop100Source")
          assert current_snapshot["asOf"] <= date.today().isoformat(), "current cohort date is in the future"
          cohort = [row for row in players if row.get("currentRank") is not None]
          assert len(cohort) + current_snapshot.get("unresolvedPlayers", 0) >= 100, (
              "current Top-100 snapshot must contain at least 100 ranked entries"
          )
          ranks = [row["currentRank"] for row in cohort]
          assert all(1 <= rank <= 100 for rank in ranks), "current cohort ranks must be within 1–100"
          assert all(
              ranks_by_player[row["id"]].get(current_year) == row["currentRank"]
              for row in cohort
          ), "currentRank must match the live-season cohort entry"

          assert meta.get("players") == len(players)
          assert meta.get("playersInCurrentTop100") == len(cohort), (
              "current Top-100 metadata count does not match live-season membership"
          )
          expanded_snapshots = meta.get("top1000SeasonSnapshots")
          assert isinstance(expanded_snapshots, list) and expanded_snapshots, "year-specific Top-1000 snapshots are missing"

          identity_override_payload = json.loads(
              Path("tools/player_identity_overrides.json").read_text(encoding="utf-8")
          )
          identity_override_rows = identity_override_payload.get("players") or []
          identity_override_ids = [row.get("atpId") for row in identity_override_rows]
          assert len(identity_override_ids) == len(set(identity_override_ids)), (
              "official ATP profile identity override IDs must be unique"
          )
          live_expanded_snapshot = next(
              row for row in expanded_snapshots if row.get("year") == current_year
          )
          applied_identity_overrides = live_expanded_snapshot.get("identityOverridesApplied", 0)
          assert 0 <= applied_identity_overrides <= len(identity_override_rows), (
              "live ranking identity override count is outside the audited source size"
          )
          # The weekly Top-1000 cohort changes. Previously audited players can leave
          # the cutoff and new players can enter; unresolved rows remain explicitly
          # reported by the builder instead of blocking every future automatic refresh.
          unresolved_live_rows = live_expanded_snapshot.get("unresolvedPlayers", 0)
          assert unresolved_live_rows >= 0

          height_override_payload = json.loads(
              Path("tools/player_height_overrides.json").read_text(encoding="utf-8")
          )
          height_override_rows = height_override_payload.get("players") or []
          height_override_ids = [row.get("atpId") for row in height_override_rows]
          assert len(height_override_ids) == len(set(height_override_ids)), (
              "verified player height override IDs must be unique"
          )
          height_enrichment = meta.get("heightEnrichment") or {}
          applied_height_overrides = height_enrichment.get("curatedProfileHeightsApplied", 0)
          assert 0 <= applied_height_overrides <= len(height_override_rows), (
              "verified player-profile height override count is outside the curated source size"
          )
          expanded_years = [row.get("year") for row in expanded_snapshots]
          assert expanded_years == expected_years, "every year must have exactly one ordered Top-1000 snapshot"

          expanded_ranks_by_player = {}
          for player in players:
              entries = player.get("top1000RanksBySeason") or []
              years = [entry.get("y") for entry in entries]
              assert len(years) == len(set(years)), f"duplicate Top-1000 season for {player.get('id')}"
              assert all(1 <= entry.get("rank", 0) <= 1000 for entry in entries), (
                  f"rank outside 1–1000 for {player.get('id')}"
              )
              expanded_ranks_by_player[player["id"]] = {entry["y"]: entry["rank"] for entry in entries}

          for snapshot in expanded_snapshots:
              year = snapshot["year"]
              snapshot_date = date.fromisoformat(snapshot["asOf"])
              assert snapshot_date.year == year, f"{year} Top-1000 snapshot must use a date from that year"
              members = [
                  (player_id, ranks[year])
                  for player_id, ranks in expanded_ranks_by_player.items()
                  if year in ranks
              ]
              unresolved = snapshot.get("unresolvedPlayers", 0)
              assert unresolved >= 0 and snapshot.get("maxRank", 0) >= 100
              assert len(members) == snapshot.get("players"), (
                  f"{year} Top-1000 identified count does not match player membership"
              )
              assert all(1 <= rank <= 1000 for _, rank in members), (
                  f"{year} Top-1000 cohort contains a rank outside 1–1000"
              )
              assert snapshot.get("rankedEntries") == len(members) + unresolved, (
                  f"{year} Top-1000 ranked-entry total does not match membership plus unresolved IDs"
              )
              assert snapshot.get("unresolvedTop500", 0) >= 0
              if year == current_year:
                  assert snapshot.get("provider") == "KickServe/TML", (
                      "current year must use the full official ATP rank feed"
                  )
                  assert snapshot.get("maxRank", 0) >= 1000, "current official ATP feed must reach rank 1000"
                  # Rank cutoffs are not fixed row counts: ranking ties/gaps and
                  # unidentified IDs can make the number of rows differ from N.
                  assert snapshot.get("rankedEntries", 0) > 0, "current official ATP feed has no identifiable Top-1000 entries"
              else:
                  assert snapshot.get("provider") == "TML archive", (
                      f"{year} historical cohort must use its matching TML ranking archive snapshot"
                  )

          current_expanded = expanded_snapshots[-1]
          current_top500_members = [
              row for row in players
              if any(entry.get("y") == current_year and entry.get("rank", 1001) <= 500
                     for entry in (row.get("top1000RanksBySeason") or []))
          ]
          current_top1000_members = [
              row for row in players
              if any(entry.get("y") == current_year
                     for entry in (row.get("top1000RanksBySeason") or []))
          ]
          assert meta.get("playersInCurrentTop500") == len(current_top500_members)
          assert meta.get("playersInCurrentTop1000") == len(current_top1000_members)
          assert len(current_top500_members) >= len(cohort), "Top 500 must contain the full Top 100 cohort"
          assert len(current_top1000_members) >= len(current_top500_members), "Top 1000 must contain the full Top 500 cohort"
          assert (
              len(current_top500_members) + current_expanded.get("unresolvedTop500", 0)
              >= len(cohort)
          ), "unresolved Top-500 rows must not make the cohort smaller than the known Top 100"

          current_match_keys = meta.get("currentSeasonMatchKeys")
          assert isinstance(current_match_keys, list) and current_match_keys, "current-season dedupe keys are missing"
          assert len(current_match_keys) == len(set(current_match_keys)), "duplicate current-season match keys"
          stat_match_keys = meta.get("currentSeasonStatMatchKeys")
          assert isinstance(stat_match_keys, list), "current-season stat match keys are missing"
          assert len(stat_match_keys) == len(set(stat_match_keys)), "duplicate current-season stat match keys"
          assert set(stat_match_keys).issubset(set(current_match_keys)), "stat keys must also be result keys"
          height_group_match_keys = meta.get("heightGroupCurrentSeasonMatchKeys")
          assert isinstance(height_group_match_keys, list), "expanded Height Groups match keys are missing"
          assert len(height_group_match_keys) == len(set(height_group_match_keys)), "duplicate expanded Height Groups match keys"
          assert set(current_match_keys).issubset(set(height_group_match_keys)), (
              "expanded Height Groups keys must include every ATP Tour match key"
          )
          height_group_stat_keys = meta.get("heightGroupCurrentSeasonStatMatchKeys")
          assert isinstance(height_group_stat_keys, list), "expanded Height Groups stat keys are missing"
          assert len(height_group_stat_keys) == len(set(height_group_stat_keys)), "duplicate expanded Height Groups stat keys"
          assert set(stat_match_keys).issubset(set(height_group_stat_keys)), (
              "expanded Height Groups stat keys must include every ATP Tour stat key"
          )
          assert set(height_group_stat_keys).issubset(set(height_group_match_keys)), (
              "expanded Height Groups stat keys must also be result keys"
          )
          assert meta.get("currentSeasonSourceMtime"), "current-season source mtime is missing"
          snapshot_date = date.fromisoformat(meta.get("currentTop100AsOf", ""))
          assert snapshot_date <= date.today(), "current cohort snapshot cannot be in the future"
          assert snapshot_date.year == current_year, "live Top 100 must use a ranking snapshot from the live season"
          assert meta.get("source") == "TennisMyLife ATP Match Database"
          assert meta.get("playersWithEligibleArchiveResults", 0) > 0
          coverage = meta.get("coverage") or {}
          assert coverage.get("matchResults", 0) > 0
          assert coverage.get("matchesWithValidStats", 0) > 0
          assert coverage.get("matchResults", 0) >= coverage.get("matchesWithValidStats", 0)
          assert coverage.get("matchesWithoutValidStats", 0) >= 0
          assert coverage.get("hardRowsWithUnknownEnvironment", 0) >= 0

          height_count = 0
          season_count = 0
          bucket_count = 0
          for player in players:
              height = player.get("heightCm")
              assert height is None or 140 <= height <= 220, f"invalid height for {player.get('id')}"
              height_count += height is not None
              seasons = player.get("seasons") or []
              years = [item["y"] for item in seasons]
              assert len(years) == len(set(years)), f"duplicate calendar seasons for {player.get('id')}"
              for season in seasons:
                  season_count += 1
                  year = season["y"]
                  assert 1968 <= year <= meta.get("lastSeason", 0), f"invalid calendar year {year}"
                  for bucket in (season.get("b") or {}).values():
                      bucket_count += 1
                      assert bucket.get("sp", 0) >= bucket.get("sw", 0) >= 0
                      assert bucket.get("rp", 0) >= bucket.get("rw", 0) >= 0
                      assert 0 <= bucket.get("sm", 0) <= bucket.get("mp", 0)
                      assert bucket.get("mp", 0) == bucket.get("w", 0) + bucket.get("l", 0)

              height_group_seasons = player.get("heightGroupSeasons") or []
              height_group_years = [item["y"] for item in height_group_seasons]
              assert len(height_group_years) == len(set(height_group_years)), (
                  f"duplicate Height Groups seasons for {player.get('id')}"
              )
              tour_by_year = {item["y"]: item for item in seasons}
              for season in height_group_seasons:
                  year = season["y"]
                  assert 1968 <= year <= meta.get("lastSeason", 0), (
                      f"invalid Height Groups calendar year {year}"
                  )
                  tour_buckets = (tour_by_year.get(year) or {}).get("b") or {}
                  for name, bucket in (season.get("b") or {}).items():
                      assert bucket.get("sp", 0) >= bucket.get("sw", 0) >= 0
                      assert bucket.get("rp", 0) >= bucket.get("rw", 0) >= 0
                      assert 0 <= bucket.get("sm", 0) <= bucket.get("mp", 0)
                      assert bucket.get("mp", 0) == bucket.get("w", 0) + bucket.get("l", 0)
                      tour_bucket = tour_buckets.get(name) or {}
                      for field in ("mp", "w", "l", "sp", "sw", "rp", "rw", "sm"):
                          assert bucket.get(field, 0) >= tour_bucket.get(field, 0), (
                              f"expanded Height Groups {field} is below ATP Tour-only data "
                              f"for {player.get('id')} {year} {name}"
                          )

          expected_height_group_stat_seasons = sorted({
              season["y"]
              for player in players
              for season in (player.get("heightGroupSeasons") or [])
              if (season.get("b") or {}).get("all", {}).get("sm", 0) > 0
          })
          assert meta.get("heightGroupStatsAvailableSeasons") == expected_height_group_stat_seasons, (
              "Height Groups stats-available seasons do not match player-level data"
          )
          lower_tier_coverage = (meta.get("heightGroupCoverage") or {}).get("challengerAndQualifying") or {}
          lower_results = lower_tier_coverage.get("matchResults", 0)
          lower_valid = lower_tier_coverage.get("matchesWithValidStats", 0)
          lower_without_stats = lower_tier_coverage.get("matchesWithoutValidStats", 0)
          assert min(lower_results, lower_valid, lower_without_stats) >= 0
          assert lower_valid + lower_without_stats == lower_results, (
              "Challenger/qualifying valid and invalid-stat counts must reconcile to match results"
          )

          assert height_count == meta.get("playersWithHeight")
          archive_players = sum(bool(row.get("seasons")) for row in players)
          assert archive_players == meta.get("playersWithEligibleArchiveResults"), (
              "all-archive directory count does not match player-season result coverage"
          )
          assert season_count > 0 and bucket_count > 0

          cohort = [row for row in players if row.get("currentRank") is not None]
          cohort_heights = [row.get("heightCm") for row in cohort if row.get("heightCm") is not None]
          bands = {
              "under183": 0,
              "183to185": 0,
              "186to188": 0,
              "189to191": 0,
              "192to194": 0,
              "195plus": 0,
          }
          for height in cohort_heights:
              if height < 183:
                  bands["under183"] += 1
              elif height <= 185:
                  bands["183to185"] += 1
              elif height <= 188:
                  bands["186to188"] += 1
              elif height <= 191:
                  bands["189to191"] += 1
              elif height <= 194:
                  bands["192to194"] += 1
              else:
                  bands["195plus"] += 1
          hard_buckets = {"hardAll": 0, "hardIndoor": 0, "hardOutdoor": 0, "hardUnknown": 0}
          for player in players:
              for season in player.get("seasons", []):
                  for key in hard_buckets:
                      hard_buckets[key] += (season.get("b", {}).get(key) or {}).get("mp", 0)
          hard_buckets = {key: value // 2 for key, value in hard_buckets.items()}

          print(
              f"Player Stats OK: {len(players)} archive players, {height_count} heights, "
              f"{len(cohort_heights)}/{len(cohort)} current-cohort heights ({snapshot_date.isoformat()}), "
              f"height bands={bands}, {season_count} player-seasons, {bucket_count} surface buckets."
          )
          print(
              f"Match coverage: {coverage['matchResults']} results, "
              f"{coverage['matchesWithValidStats']} with valid Hold/Break inputs, "
              f"{coverage['matchesWithoutValidStats']} without valid stats, "
              f"{coverage['duplicateMatchRowsSkipped']} duplicate rows skipped."
          )
          print(
              f"Hard-court matches: {hard_buckets}; "
              f"{coverage['hardRowsWithUnknownEnvironment']} source rows have unknown indoor/outdoor setting."
          )
          PY

      - name: Commit only the Player Stats assets
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name "court-pace-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/player_stats.json app/src/main/assets/player_stats.json
          if git diff --cached --quiet; then
            echo "No Player Stats data change."
            exit 0
          fi

          git commit -m "chore: refresh private Player Stats archive"
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          for attempt in 1 2 3; do
            git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch"
            if ! git rebase "origin/$branch"; then
              git rebase --abort || true
              echo "Could not safely rebase Player Stats output onto the latest $branch."
              exit 1
            fi
            if git push origin "HEAD:refs/heads/$branch"; then
              echo "Published only Player Stats assets to $branch."
              exit 0
            fi
            echo "Push raced with another branch update (attempt $attempt/3)."
            sleep $((attempt * 2))
          done
          echo "Could not publish Player Stats assets after three attempts."
          exit 1
