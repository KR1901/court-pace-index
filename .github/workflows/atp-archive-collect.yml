name: ATP official archive one-time collection

on:
  push:
    branches:
      - feature/atp-event-period-contract-pace-year-picker-20261127
    paths:
      - "tools/_atp_archive_collect.py"
      - ".github/workflows/atp-archive-collect.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    name: ATP archive ${{ matrix.year }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        year: [1991, 1992, 1993, 1994, 1995, 1996, 1997, 1998, 1999, 2000,
               2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009, 2010,
               2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020,
               2021, 2022, 2023, 2024, 2025, 2026]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser automation
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Collect official ATP event cards
        run: python tools/_atp_archive_collect.py "${{ matrix.year }}"
      - name: Upload one-season ATP archive metadata
        uses: actions/upload-artifact@v4
        with:
          name: atp-archive-${{ matrix.year }}
          path: atp_archive_${{ matrix.year }}.json
          if-no-files-found: error
          retention-days: 7
